# Guard local accessibility workflows without publishing or deploying the site.
name: Accessibility regression
on:
  pull_request:
  push:
    branches: ['accessibility/**']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pipeline integrity checks compare against a preserved historical scenario.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:prototypes
      - run: npm run test:pipeline
      - run: npm run test:lifecycle
      - run: npm run test:resource-guidance
      - run: npm run test:resource-about
      - run: npm run test:resource-about:browser
        env:
          RESOURCE_ABOUT_OUTPUT: accessibility-evidence/resource-guides
      - run: npm run test:workshop
        env:
          WORKSHOP_OUTPUT: accessibility-evidence/workshop
      - run: npm run test:prototypes:browser
      - run: npm run test:a11y
        env:
          A11Y_OUTPUT: accessibility-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-evidence
          path: accessibility-evidence
