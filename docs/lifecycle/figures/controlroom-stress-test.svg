<title id="title">Figure 2. The same frozen intervention under three stress conditions</title><desc id="desc">Actual software simulation observations under authored, uncalibrated actor/environment assumptions. Easy completes the procedure, medium accepts stale data, hard is withheld. No human learning is measured.</desc>
