</main><script>
(function(){
const items=[['case-tab','cases'],['sim-tab','simulation']];
function select(i){items.forEach(([b,f],j)=>{document.getElementById(b).setAttribute('aria-selected',String(i===j));document.getElementById(b).tabIndex=i===j?0:-1;document.getElementById(f).hidden=i!==j;});document.getElementById('activity-note').textContent=i===0?'Five worked cases with why / teaching points. Study, Find the turn, or Predict first; source narratives retained, with historical claims not independently rechecked.':'Fictional adventure with decision guidance before choices and reflection afterward. Edit steps, inspect outcomes, revise and compare branches; probabilities are teaching assumptions.';}
items.forEach(([b,frame],i)=>document.getElementById(b).addEventListener('click',()=>{select(i);history.replaceState(null,'','#'+frame)}));
document.querySelector('[role=tablist]').addEventListener('keydown',event=>{const current=items.findIndex(([id])=>id===event.target.id);if(current<0||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?1:1-current;document.getElementById(items[next][0]).click();document.getElementById(items[next][0]).focus();});
function restoreTab(){select(location.hash==='#simulation'?1:0)}
window.addEventListener('hashchange',restoreTab);
restoreTab();
})();
</script></body></html>
