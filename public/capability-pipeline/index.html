<!doctype html>
<!-- Hosts the Capability Pipeline case explorer and branching simulation. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Capability Pipeline — cases and simulation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3ee;color:#182420;font:16px system-ui,sans-serif}
header{padding:16px 24px;border-bottom:1px solid #cfd6c8;background:#fff}h1{font:600 24px Georgia,serif;margin:0 0 12px}nav{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;min-height:44px;border:1px solid #1c6e66;border-radius:8px;padding:9px 16px;background:white;color:#1c6e66;cursor:pointer}button[aria-selected=true]{background:#1c6e66;color:white}button:focus-visible{outline:3px solid #a3650f;outline-offset:3px}p{margin:10px 0 0;font-size:14px;color:#55645c}iframe{display:block;width:100%;height:calc(100vh - 165px);min-height:600px;border:0;background:white}iframe[hidden]{display:none}@media(max-width:600px){header{padding:12px}iframe{height:78vh}}
</style></head><body>
<header><p><a href="https://capabilitymatters.org/problems-to-prototypes/">← Problems → Prototypes</a></p><h1>The Capability Pipeline</h1><nav role="tablist" aria-label="Activities">
<button id="case-tab" role="tab" aria-selected="true" aria-controls="cases">Explore five cases</button>
<button id="sim-tab" role="tab" aria-selected="false" aria-controls="simulation">Choose your own adventure</button>
</nav><p id="activity-note">Five worked cases with why / teaching points. Study, Find the turn, or Predict first; source narratives retained, with historical claims not independently rechecked.</p></header>
<iframe id="cases" role="tabpanel" aria-labelledby="case-tab" title="Original five-case explorer" src="cases.html?v=adoption-loop-1"></iframe>
<iframe id="simulation" role="tabpanel" aria-labelledby="sim-tab" title="Editable branching simulation" hidden src="simulation.html?v=map-teaching-1"></iframe>
<script>
(function(){
const items=[['case-tab','cases'],['sim-tab','simulation']];
function select(i){items.forEach(([b,f],j)=>{document.getElementById(b).setAttribute('aria-selected',String(i===j));document.getElementById(f).hidden=i!==j;});document.getElementById('activity-note').textContent=i===0?'Five worked cases with why / teaching points. Study, Find the turn, or Predict first; source narratives retained, with historical claims not independently rechecked.':'Fictional adventure with decision guidance before choices and reflection afterward. Edit steps, inspect outcomes, revise and compare branches; probabilities are teaching assumptions.';}
items.forEach(([b,frame],i)=>document.getElementById(b).addEventListener('click',()=>{select(i);history.replaceState(null,'','#'+frame)}));
function restoreTab(){select(location.hash==='#simulation'?1:0)}
window.addEventListener('hashchange',restoreTab);
restoreTab();
})();
</script></body></html>
