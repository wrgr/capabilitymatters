<title>Evidence Studio · Garden case 14</title>
<style>
:root{--ink:#172e2b;--muted:#52665f;--paper:#f4f3ea;--white:#fffef8;--green:#176149;--line:#cbd4c8;--gold:#f1cc6b;--soft:#e6eee4}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 system-ui,sans-serif}button,select,textarea,input{font:inherit}button,select{border:1px solid var(--line);border-radius:9px;background:var(--white);color:var(--ink);padding:.65rem .9rem}button{cursor:pointer}button:hover{background:var(--soft)}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.55;cursor:default}button[aria-pressed=true]{background:var(--green);color:white}button:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #9c4c13;outline-offset:4px}header{padding:16px max(20px,calc((100% - 1120px)/2));background:var(--ink);color:white;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header strong{letter-spacing:.04em}header small{color:#cfdcd1}.toolbar,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar button{padding:.4rem .7rem;font-size:.9rem}main{max-width:1160px;margin:auto;padding:30px 20px 65px}h1{font-size:clamp(2.2rem,5vw,3.5rem);line-height:1.08;letter-spacing:-.045em;margin:12px 0 20px;max-width:850px}h2{font-size:1.6rem;line-height:1.2;margin:0 0 14px}h3{margin:0 0 10px;font-size:1.15rem}p{margin:8px 0 16px}.eyebrow{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;font-weight:750;color:var(--green)}.hero{display:grid;grid-template-columns:2fr 1fr;gap:32px;margin-bottom:28px}.note{border-left:4px solid var(--gold);padding:14px 18px;background:#fff8db}.small,small{font-size:.88rem;color:var(--muted)}.panel{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px;margin:20px 0}.sectionhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px}.card.selected{box-shadow:inset 0 4px var(--green)}.badge{display:inline-block;background:var(--soft);padding:2px 8px;border-radius:6px;font-size:.8rem;font-weight:700}.cardtitle{display:flex;justify-content:space-between;align-items:center}.letter{font-size:2rem;font-weight:800}.facts{display:grid;grid-template-columns:1fr auto;gap:5px;font-size:.92rem}.facts dt,.facts dd{margin:0}.facts dd{font-weight:650;text-align:right}.comparison{background:var(--soft);padding:18px;border-radius:12px;margin-top:18px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}.quote{font-size:1.15rem;white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid var(--green);padding-left:14px}.empty{color:var(--muted);font-style:italic}.actionbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}label{display:block;margin:14px 0 5px;font-weight:650}select,textarea{width:100%;max-width:100%}textarea{display:block;min-height:100px;padding:12px;border:1px solid var(--line);border-radius:8px;resize:vertical}fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:16px 0}legend{font-weight:650;padding:0 6px}fieldset label{font-weight:400}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:7px}details{margin:16px 0}summary{cursor:pointer;font-weight:650}.review{max-width:850px;margin:auto}.review h1{font-size:2.5rem}.paperpage{border-top:2px solid var(--ink);padding-top:20px;margin-top:32px;break-before:page}.blank{border-bottom:1px solid var(--muted);height:34px;margin:6px 0}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.pill{background:var(--gold);border-radius:30px;padding:4px 12px;font-size:.85rem}svg{display:block;width:100%;height:auto;margin:14px 0}.center{text-align:center;padding:80px 20px;max-width:700px;margin:auto}.error{background:#ffe9df;padding:12px;border-left:4px solid #9c4c13}@media(max-width:680px){.hero,.split{grid-template-columns:1fr}.hero{gap:12px}.panel{padding:18px}main{padding:20px 14px}.cards{grid-template-columns:1fr}header{padding:14px}h1{font-size:2.4rem}}@media print{body{background:white;font-size:11pt}header,.noprint,#live{display:none!important}main{padding:0;max-width:none}.paperpage{break-before:page}.cards{grid-template-columns:1fr 1fr}.card,.panel{break-inside:avoid;border-radius:0}.panel{margin:10px 0;padding:12px}svg{max-height:140px}button{display:none!important}h1{font-size:24pt}.note{background:white}.blank{height:26px}}

<body><header id="top"></header><main id="app"></main><div id="live" class="sr" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fixtures={A:[1,'bright',12,'upright'],B:[2,'dim',18,'drooping'],C:[2,'bright',10,'upright'],W1:[1,'bright',11,'upright'],W2:[2,'bright',13,'upright'],L1:[2,'bright',9,'upright'],L2:[2,'dim',14,'drooping']};
const pairs={AB:['A','B'],AC:['A','C'],BC:['B','C'],W:['W1','W2'],L:['L1','L2']};
const differences={AB:'B finishes 6 cm taller; water and light differ.',AC:'A finishes 2 cm taller; light matches and water differs.',BC:'B finishes 8 cm taller; water matches and light differs.',W:'W2 finishes 2 cm taller; water differs; other listed conditions match.',L:'L2 finishes 5 cm taller; light differs; other listed conditions match.'};
const unknown='Starting height, plant type and soil are unrecorded. Final height is not growth; leaves do not establish health.';
const limits='Temperature, individual variation and other conditions are unrecorded; replication and allocation are unspecified. These separate authored examples do not fill A/B/C gaps or establish causes or predictions.';
const suggestions=['B finishes taller than A in these records','Water-2 plants always finish taller in this story','These records do not settle what caused the height difference'];
const relationships=['Not selected','My claim describes these records','My claim goes beyond these records','I have not decided how they connect'];
const representations=['One offered explanation','Agreed group explanation — selected, unverified','Unresolved discussion'];
function fresh(){return {initial:null,later:null,pair:'AB',reveal:false,plan:null,practice:null,rep:representations[0],dissent:false};}
let state=fresh(), recovery=null, boundary={closed:false,blocked:[]}, pending=null, withdrawal=null;
let screen='activity', coverFrom=null, handoffFrom=null, paperFrom=null, reviewer=false, serial=0, error='';
const id=()=> 'c'+(++serial), version=()=> 'v'+(++serial);
const latest=r=>r?.versions?.at(-1)?.text??'';
const active=r=>r&&r.status==='active';
const blocked=r=>r&&(boundary.blocked.includes(r.id)||r.deps.some(x=>boundary.blocked.includes(x)));
function needed(r){return {id:null,deps:[],versions:[],status:'needed',pair:r?.pair??state.pair,rel:relationships[0],action:'New position needed',route:'none'};}
function sanitize(s){if(!s)return null;const n=clone(s);if(boundary.closed)n.initial={status:'withdrawn',id:null,deps:[],versions:[],pair:null,rel:null,action:null,route:null};if(blocked(n.later))n.later=needed(n.later);return n;}
function failures(s){const f=[];if(boundary.closed&&(s.initial?.status!=='withdrawn'||s.initial.versions.length||s.initial.pair||s.initial.rel))f.push('Initial slot boundary');if(blocked(s.later))f.push('Blocked later dependency');if(!s.reveal&&s.pair!=='AB')f.push('Unrevealed comparison');return f;}
function commit(n){const f=failures(n);if(f.length){error='This change was stopped: '+f.join(', ')+'. Cancel or pause for facilitation.';render();return false;}recovery=sanitize(state);state=clone(n);error='';return true;}
function say(t){$('live').textContent=t;}
function button(label,action,extra=''){return `<button data-do="${action}" ${extra}>${label}</button>`;}
function options(list,value){return list.map(x=>`<option ${x===value?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('');}
function graph(k){const h=fixtures[k][2];return `<svg viewBox="0 0 290 100" role="img" aria-label="${k}: final height ${h} cm on a 0 to 20 cm scale"><text x="10" y="15" font-size="12" fill="currentColor">Final height (cm)</text><rect x="12" y="29" width="260" height="24" rx="3" fill="#e6eee4"/><rect x="12" y="29" width="${h*13}" height="24" rx="3" fill="#176149"/><text x="${Math.max(18,h*13-24)}" y="46" fill="white" font-size="14" font-weight="700">${h}</text>${[0,5,10,15,20].map(t=>`<path d="M${12+t*13} 57v6" stroke="#52665f"/><text x="${12+t*13}" y="81" text-anchor="middle" font-size="12" fill="currentColor">${t}</text>`).join('')}</svg>`;}
function card(k,selected=false){const f=fixtures[k],prepared=k.length>1;return `<article class="card ${selected?'selected':''}"><div class="cardtitle"><span class="letter">${k}</span><span class="badge">Invented · 14 days</span></div>${graph(k)}<dl class="facts"><dt>Water / day</dt><dd>${f[0]} story unit${f[0]===1?'':'s'}</dd><dt>Light</dt><dd>${f[1]}</dd><dt>Final height</dt><dd>${f[2]} cm</dd><dt>Leaves</dt><dd>${f[3]}</dd>${prepared?'<dt>Starting height</dt><dd>4 cm</dd><dt>Fictional type</dt><dd>T</dd><dt>Fictional soil mix</dt><dd>S</dd>':''}</dl><p class="small">${prepared?'Authored comparison fixture.':'Invented story record.'} Not measurements, plant-care advice or real outcomes.${selected?' Selected for comparison.':''}</p></article>`;}
function pairView(p){return `<div class="cards">${pairs[p].map(k=>card(k,true)).join('')}</div><div class="comparison"><strong>${p==='W'?'W1/W2':p==='L'?'L1/L2':p.split('').join('/')} · recorded comparison</strong><p>${differences[p]}</p><p class="small">${p==='W'||p==='L'?limits:unknown}</p></div>`;}
function recordView(r,label){if(!r)return `<h3>${label}</h3><p class="empty">No position recorded. You may pass.</p>`;if(r.status==='withdrawn')return `<h3>${label}</h3><p>Initial position withdrawn.</p>`;if(r.status==='needed')return `<h3>${label}</h3><p>New position needed.</p><p class="small">Comparison context: ${esc(r.pair)}. No claim or relationship remains.</p>`;return `<h3>${label}</h3><p class="quote">${r.status==='withheld'?'No current claim — withheld':esc(latest(r))}</p><p class="small">Action: ${esc(r.action)} · Recorded pair: ${esc(r.pair)}<br>Learner-selected relationship: ${esc(r.rel)}<br>${r.route==='independent'?'New independent route selected; independence is unverified.':r.deps.length?'Tracked copy of the initial contribution.':'One offered position.'}</p>${r.versions.length>1?`<details><summary>Active wording versions (${r.versions.length})</summary>${r.versions.map((v,i)=>`<p class="small">${i===0?'Original':'Correction '+i} · ${esc(v.id)}</p><p class="quote">${v.text?esc(v.text):'Withheld'}</p>`).join('')}</details>`:''}`;}
function representationView(s){return `<p><strong>Representation:</strong> ${esc(s.rep)}<br><strong>Dissent:</strong> ${s.dissent?'Present — independent of revision':'Not marked; absence does not establish agreement'}</p>${s.dissent&&s.rep===representations[1]?'<p class="note">Agreement and dissent are both selected. Review representation with people; the tool cannot settle it.</p>':''}`;}
function synthesis(s){return `<div class="split"><div>${recordView(s.initial,'Before · initial position')}</div><div>${recordView(s.later,'After · later position')}</div></div>${s.later&&s.later.status!=='needed'?`<p class="small">Literal change: ${s.initial?.status==='withdrawn'?'initial history was withdrawn':latest(s.initial)===latest(s.later)?'current wording is the same':'current wording differs'}. Later recorded pair: ${esc(s.later.pair)}. This is no judgment of the explanation.</p>`:''}${boundary.closed?'<p class="note">History is incomplete after withdrawal. The initial slot stays closed for this activity.</p>':''}${representationView(s)}`;}
function help(){return `<details class="panel"><summary>Help, facilitation & review status</summary><p>Speak, use another language, ask a scribe, pass, or use paper. Take turns on the device. The operator cannot speak for everyone. Pause contested attribution or removal; a click does not verify permission.</p><p>This rehearsal uses no learner judgment, grades or plant-growth calculator. Claims and relationships are selected views. No actual student records should be entered.</p><p>Work stays in application memory only; closing or reloading loses it. Cover is not a lock. Handoff clears application-controlled work and recovery, but cannot control screenshots, browser history, autofill or device records.</p><p>Technical review, practitioner, teacher, student and caregiver review, human pilots, learning, retention, transfer and flourishing evidence remain pending. Simulation role; no credentialed practice or real-use approval. Parent iteration is background only.</p><p>Provisional source: Map revision 2 (sequence 32) governs withdrawal and dependencies over Design revision 2 (sequence 29); implementation draft sequence 38. This candidate applies that reconciliation without claiming human approval.</p><p>Suggestions can cue responses; C can feel like a trap; summaries can conceal refusal; withdrawal removes useful history and adds facilitation work. Paper-only delivery, fixture replacement and rejection remain available.</p><div class="actionbar">${button('Open complete paper / facilitation kit','paper')}${button(reviewer?'Hide reviewer diagnostics':'Show reviewer diagnostics','diagnostics')}</div>${reviewer?`<p class="small">Screen: ${screen} · Proposal: ${pending?.target??'none'} · Recovery: ${recovery?'available':'none'} · Withdrawal boundary: ${boundary.closed?'closed':'open'} · Invariants: ${[...failures(state),...(recovery?failures(recovery):[])].join(', ')||'no state failure detected'}. No wording, logs or telemetry in this panel. Focus and accessibility behavior need browser review.</p>`:''}</details>`;}
function activity(){const current=state.later&&state.later.status!=='needed'?state.later:state.initial;return `<div class="hero"><div><span class="eyebrow">Garden case 14 · evidence studio</span><h1>What can these records tell us?</h1><p>Help a fictional school garden team explain its records. Compare two cards, offer a claim, then decide what another record changes.</p><span class="pill">No typing required · passing is welcome</span></div><aside class="note"><strong>Your mission</strong><p>Make the connection between a claim and its evidence visible. You can keep, change or withhold your position.</p><p class="small">All evidence is an invented 14-day story. There is no score.</p></aside></div><section aria-labelledby="evidenceHeading"><div class="sectionhead"><h2 id="evidenceHeading">01 · Inspect the records</h2><span class="small">${state.reveal?'Three records available':'A/B is the only opening pair'}</span></div><div class="cards">${['A','B',...(state.reveal?['C']:[])].map(k=>card(k,pairs[state.pair].includes(k))).join('')}</div><div class="panel"><div class="row">${(state.reveal?['AB','AC','BC']:['AB']).map(p=>button('Compare '+p.split('').join('/'),'pair:'+p,`aria-pressed="${state.pair===p}"`)).join('')}</div><div class="comparison"><strong>Selected pair: ${state.pair.split('').join('/')}</strong><p>${differences[state.pair]}</p><p class="small">${unknown}</p>${state.reveal?'<details><summary>What does C add?</summary><p>C records water 2 and final height 10 cm; A records water 1 and final height 12 cm. This challenges the universal descriptive water-2 claim in this story, without establishing an opposite causal rule. You may keep your position.</p></details>':''}</div><h3 style="margin-top:18px">Claim beside this comparison</h3><p class="quote">${current?.status==='withdrawn'?'Initial position withdrawn':active(current)?esc(latest(current)):current?.status==='withheld'?'No current claim — withheld':'No active claim selected'}</p><p class="small">${current?.rel?esc(current.rel):'Relationship not selected'}. Pair changes leave recorded wording and relationship intact; a position records its pair only after review.</p><div class="actionbar">${button(state.initial?'Correct initial position':'Offer an opening position','initial',boundary.closed?'disabled':'')}${state.initial&&!boundary.closed?button('Withdraw initial position','withdraw'):''}${button('Pass / discuss orally','pass')}</div></div></section>${!state.reveal?`<section class="panel"><span class="eyebrow">Next evidence</span><h2>Another record is waiting</h2><p>It may complicate the explanation. You can keep your position.</p>${button('Reveal record C','reveal','class="primary"')}</section>`:`<section class="panel"><span class="eyebrow">02 · Plan a comparison</span><h2>The test-planning bench</h2><p>Choose a recorded condition to hold constant. Inspect a prepared fictional example.</p><div class="row">${button('Hold light constant; compare water','plan:W',`aria-pressed="${state.plan==='W'}"`)}${button('Hold water constant; compare light','plan:L',`aria-pressed="${state.plan==='L'}"`)}</div>${state.plan?`<div style="margin-top:18px">${pairView(state.plan)}</div>`:'<p class="small">No fixture selected. These fixed outcomes are authored examples, not an experiment or prediction.</p>'}</section><section class="panel"><span class="eyebrow">03 · Reconsider</span><h2>What position will you offer now?</h2><p>Each choice opens a proposal. Review it before recording it.</p><div class="row">${['Retain','Narrow','Revise','Withhold'].map(a=>button(a,'later:'+a,a==='Retain'&&!active(state.initial)?'disabled':'')).join('')}</div>${!active(state.initial)?'<p class="small">Retain needs an active initial wording. Choose a new independent later position or withhold.</p>':''}<div class="actionbar">${button('New independent later position','independent')}${state.later&&state.later.status!=='needed'?button('Correct later position (keep dependencies)','correctLater'):''}</div></section>`}<section class="panel"><div class="sectionhead"><h2>Our explanation, so far</h2>${button('Review representation & dissent','representation')}</div>${synthesis(state)}</section>${state.reveal&&state.plan?`<section class="panel"><h2>Optional · a changed comparison</h2><p>Try the other prepared fixture with fewer suggestions. This is supported practice, not evidence of transfer.</p>${button(state.practice?'Revisit separate practice':'Open separate practice','practice')}${state.practice?`<p class="small">Saved practice: fixture ${state.practice.fixture}; position ${esc(state.practice.choice)}; relationship ${esc(state.practice.rel)}; action ${esc(state.practice.action)}.</p>`:''}</section>`:''}${help()}`;}
function newRecord(text='',deps=[],route='independent'){return {id:id(),deps,versions:[{id:version(),text}],status:text?'active':'withheld',pair:state.pair,rel:relationships[0],action:'Revise',route};}
function beginInitial(){if(boundary.closed)return;const r=state.initial?clone(state.initial):newRecord();if(state.initial)r.versions.push({id:version(),text:latest(r)});r.action=state.initial?'Correct initial':'Initial';r.route='initial';r.pair=state.initial?'AB':null;pending={target:'initial',record:r,choice:state.initial?(r.status==='withheld'?'withhold':'own'):'',rep:state.rep,dissent:state.dissent};screen='edit';render(true);}
function beginLater(action,independent=false,correction=false){let r;if(correction){r=clone(state.later);r.versions.push({id:version(),text:latest(r)});r.action='Correct later';}else if(action==='Retain'){if(!active(state.initial))return;r=newRecord(latest(state.initial),[state.initial.id],'copied');r.action=action;}else{r=newRecord('',[],independent?'independent':'new later');r.action=action;}
pending={target:'later',record:r,choice:action==='Retain'||correction?(r.status==='withheld'?'withhold':'own'):action==='Withhold'?'withhold':'',rep:state.rep,dissent:state.dissent};screen='edit';render(true);}
function representationControls(p){return `<label for="rep">Representation</label><select id="rep" data-field="rep">${options(representations,p.rep)}</select><label><input type="checkbox" data-field="dissent" ${p.dissent?'checked':''}>Dissent is present (independent of revision)</label><p class="small">Agreement is selected, not verified. Passing does not change this record.</p>`;}
function edit(){const p=pending;if(p.target==='representation')return `<div class="review panel"><h1 tabindex="-1" id="screenHeading">Review representation</h1>${representationControls(p)}${editButtons()}</div>`;
const r=p.record,initial=p.target==='initial';return `<div class="review panel"><span class="eyebrow">Uncommitted proposal</span><h1 tabindex="-1" id="screenHeading">${initial?'Opening position / correction':'Later position / correction'}</h1><p>Choose wording or withhold. Your current work stays intact until confirmation.</p>${!initial?`<fieldset><legend>Reconsideration action</legend><div class="row">${['Retain','Narrow','Revise','Withhold'].map(a=>button(a,'draftAction:'+a,`aria-pressed="${r.action===a}" ${a==='Retain'&&!active(state.initial)?'disabled':''}`)).join('')}</div><p class="small">Editing a copied draft keeps its source dependency. Use the deliberate new independent route to start a separate contribution.</p>${button('Start a new independent later proposal','independent')}</fieldset>`:''}<label for="choice">Position</label><select id="choice" data-field="choice" ${!initial&&r.action==='Withhold'?'disabled':''}><option value="">Choose a position…</option>${[...new Set([...suggestions,...(!initial?[differences[r.pair].split(';')[0]+' in these records']:[]),...(p.choice&&!['own','withhold'].includes(p.choice)?[p.choice]:[])])].map(t=>`<option value="${esc(t)}" ${p.choice===t?'selected':''}>${esc(t)}</option>`).join('')}<option value="own" ${p.choice==='own'?'selected':''}>Own wording (or discuss orally)</option><option value="withhold" ${p.choice==='withhold'?'selected':''}>Withhold a current claim</option></select>${p.choice==='own'?`<label for="${initial?'initialText':'laterText'}">Optional ${initial?'initial':'later'} wording</label><textarea id="${initial?'initialText':'laterText'}" data-field="wording" autocomplete="off" spellcheck="false" maxlength="1600">${esc(latest(r))}</textarea><p class="small">For oral-only work, use Pass and keep the explanation off-screen.</p>`:''}${p.choice==='own'?'':`<p class="quote">${r.status==='withheld'?'No current claim — withheld':esc(latest(r))}</p>`}${initial?`<label><input type="checkbox" data-field="openingPair" ${r.pair==='AB'?'checked':''}>Use A/B — the only opening pair</label>`:`<label for="editPair">Evidence pair for this position</label><select id="editPair" data-field="pair">${options(state.reveal?['AB','AC','BC']:['AB'],r.pair)}</select>`}<div class="comparison"><strong>${r.pair??'A/B'} · recorded comparison</strong><p>${differences[r.pair??'AB']}</p><p class="small">${unknown}</p></div><label for="rel">How do they connect? Optional, your selected view</label><select id="rel" data-field="rel">${options(relationships,r.rel)}</select>${representationControls(p)}${editButtons()}</div>`;}
function editButtons(){return `<div class="actionbar">${button('Review exact proposal','review','class="primary"')}${button('Cancel edit','cancelEdit')}${button('Pass without recording','cancelPass')}${state.initial&&!boundary.closed?button('Withdraw initial position','withdraw'):''}</div>`;}
function proposal(){const p=pending;return `<div class="review panel"><span class="eyebrow">Confirmation</span><h1 id="screenHeading" tabindex="-1">Is this the record you intend?</h1>${p.target==='representation'?'':recordView(p.record,p.target==='initial'?'Proposed initial position':'Proposed later position')}${representationView(p)}<p class="small">Confirmation records the exact proposal above. It does not certify permission, agreement or scientific validity.</p><div class="actionbar">${button('Confirm this proposal','confirm','class="primary"')}${button('Back to edit','backEdit')}${button('Cancel edit','cancelEdit')}${state.initial&&!boundary.closed?button('Withdraw initial position','withdraw'):''}</div></div>`;}
function applyProposal(){const n=clone(state);if(pending.target!=='representation')n[pending.target]=clone(pending.record);n.rep=pending.rep;n.dissent=pending.dissent;if(commit(n)){pending=null;screen='activity';render(true);say('Proposal recorded exactly as reviewed.');}}
function scopeIds(){const set=new Set([state.initial?.id,pending?.target==='initial'?pending.record.id:null,recovery?.initial?.id].filter(Boolean));for(const [key,r] of [['current',state.later],['draft',pending?.target==='later'?pending.record:null],['checkpoint',recovery?.later]])if(r&&(r.deps.some(x=>set.has(x))||withdrawal.extra.includes(key)))set.add(r.id);return [...set].filter(Boolean);}
function affected(r,ids){return r&&(ids.includes(r.id)||r.deps.some(x=>ids.includes(x)));}
function withdrawalView(){const ids=scopeIds();return `<div class="review panel"><span class="eyebrow">Separate removal transaction</span><h1 id="screenHeading" tabindex="-1">Review initial withdrawal</h1><p>No identity or reason is requested. If authority or scope is contested, pause for facilitation. This tool cannot discover paraphrases or verify permission.</p>${recordView(state.initial,'Initial contribution and active versions')}<p class="small">All initial versions, its relationship and its contribution-bound pair will be removed. The initial slot will stay closed for this activity.</p><fieldset><legend>Tracked copies and additional scope</legend>${[['current',state.later,'Current later contribution'],['draft',pending?.target==='later'?pending.record:null,'Suspended later proposal'],['checkpoint',recovery?.later,'Later contribution in recovery checkpoint']].map(([key,r,label])=>r&&r.id?`<div><p><strong>${label}</strong> · ${esc(r.id)}</p>${recordView(r,'Content to inspect')}${r.deps.some(x=>ids.includes(x))?'<p>Tracked dependent copy — included automatically.</p>':`<label><input type="checkbox" data-scope="${key}" ${withdrawal.extra.includes(key)?'checked':''}>Include ${label.toLowerCase()} as additional affected content</label>`}</div>`:'').join('')}<p class="small">Selecting a contribution includes all its versions and copies with that identifier, including recovery. No string matching or ownership inference is used.</p></fieldset><div class="note"><strong>Consequences in the reviewed scope</strong><p>${state.later&&affected(state.later,ids)?'The later position will become “New position needed”; its pair remains as comparison context.':'Independent later work remains.'} ${pending&&affected(pending.record,ids)?'The affected pending proposal will be discarded.':'Any independent pending proposal is preserved.'}</p><p>Recovery: ${recovery?'the existing checkpoint will be sanitized and kept with reduced scope; removed positions cannot return.':'no checkpoint exists.'} Withdrawal creates no checkpoint. Planning, practice, representation and dissent remain. Synthesis history becomes incomplete.</p></div><div class="actionbar">${button('Confirm reviewed withdrawal','confirmWithdrawal','class="primary"')}${button('Cancel withdrawal; preserve work','cancelWithdrawal')}${button('Pause for facilitation','cover')}</div></div>`;}
function withdrawNow(){const returnTo=withdrawal.from;const ids=scopeIds();boundary={closed:true,blocked:[...new Set([...boundary.blocked,...ids])]};state=sanitize(state);recovery=sanitize(recovery);if(pending?.record&&affected(pending.record,ids))pending=null;withdrawal=null;screen=pending?returnTo:'activity';error='';$('live').textContent='';render(true);say('Initial position withdrawn. History is incomplete; removed content cannot be recovered.');}
function recoveryView(){const s=sanitize(recovery);return `<div class="review panel"><h1 id="screenHeading" tabindex="-1">Review the preceding checkpoint</h1>${s?`${synthesis(s)}<p>Current comparison: ${s.pair}; C: ${s.reveal?'revealed':'not revealed'}; planning: ${s.plan??'not selected'}.</p><p>Practice: ${s.practice?esc(JSON.stringify(s.practice)):'not recorded'}.</p><p class="small">${boundary.closed?'Reduced scope: withdrawal boundaries stay in force. Removed wording and dependencies cannot return.':'This restores all displayed activity fields together.'} Restore consumes this checkpoint. There is no reverse recovery. A suspended edit will be discarded on restore.</p>`:'<p>No recovery checkpoint is available.</p>'}<div class="actionbar">${s?button('Restore reviewed checkpoint','restore','class="primary"'):''}${button('Cancel recovery review','cancelRecovery')}</div></div>`;}
let recoveryFrom=null;
function practiceChoices(fixture){return ['Not selected',differences[fixture].split(';')[0]+' in these records','Withhold a current claim','Own position discussed orally — wording not recorded'];}
function activePractice(p,fixture){return !!p&&p.fixture===fixture&&practiceChoices(fixture).slice(1).includes(p.choice)&&p.choice!=='Withhold a current claim'&&['Retain','Revise'].includes(p.action);}
function practiceIssue(p){if(!p||!['W','L'].includes(p.fixture)||!practiceChoices(p.fixture).slice(1).includes(p.choice))return 'Choose an observation, withhold or the oral route; or skip practice.';if(!['Retain','Revise','Withhold'].includes(p.action))return 'Choose Revise or an available Retain action for this position before review.';if((p.action==='Withhold')!==(p.choice==='Withhold a current claim'))return 'Withhold records no current claim. Resolve the position and action before review.';if(p.action==='Retain'&&(!activePractice(state.practice,p.fixture)||p.choice!==state.practice.choice))return 'Retain needs the existing active position in this fixture. Choose Revise or Withhold.';return '';}
function changePractice(field,value){const p=pending.practice;if(field==='practiceChoice'){p.choice=value;if(value==='Withhold a current claim')p.action='Withhold';else if(p.action==='Withhold'||(p.action==='Retain'&&(!activePractice(state.practice,p.fixture)||value!==state.practice.choice)))p.action='';}else if(field==='practiceAction'){if(value==='Retain'&&!activePractice(state.practice,p.fixture)){error='There is no active recorded position in this fixture to retain. Choose Revise or Withhold.';return;}p.action=value;if(value==='Retain')p.choice=state.practice.choice;if(value==='Withhold')p.choice='Withhold a current claim';if(value==='Revise'&&p.choice==='Withhold a current claim')p.choice='Not selected';}}
function practiceView(){const p=pending.practice;return `<div class="review panel"><span class="eyebrow">Optional supported practice · separate record</span><h1 id="screenHeading" tabindex="-1">What about this comparison?</h1>${pairView(p.fixture)}<label for="practiceChoice">Your position</label><select id="practiceChoice" data-field="practiceChoice">${options(practiceChoices(p.fixture),p.choice)}</select><label for="practiceRel">Optional relationship</label><select id="practiceRel" data-field="practiceRel">${options(relationships,p.rel)}</select><label for="practiceAction">Reconsideration action</label><select id="practiceAction" data-field="practiceAction"><option value="" ${!p.action?'selected':''}>Choose an action…</option>${['Retain','Revise','Withhold'].map(a=>`<option value="${a}" ${a===p.action?'selected':''} ${a==='Retain'&&!activePractice(state.practice,p.fixture)?'disabled':''}>${a}</option>`).join('')}</select><p class="small">Withhold records no current claim. After changing a withheld position, choose an action before review. Retain uses the existing active position in this fixture.</p><p class="small">No third text field. Record an oral route without reproducing wording. This cannot demonstrate retention or transfer.</p><div class="actionbar">${button('Review practice record','reviewPractice','class="primary"')}${button('Skip / cancel practice','cancelEdit')}</div></div>`;}
function practiceReview(){const p=pending.practice;return `<div class="review panel"><h1 id="screenHeading" tabindex="-1">Review separate practice</h1><p>Fixture: ${p.fixture}<br>Position: ${esc(p.choice)}<br>Relationship: ${esc(p.rel)}<br>Action: ${esc(p.action)}</p><div class="actionbar">${button('Confirm practice record','confirmPractice','class="primary"')}${button('Back to practice','backPractice')}${button('Cancel practice','cancelEdit')}</div></div>`;}
function paper(){return `<div class="noprint actionbar">${button('Return to preserved studio','returnPaper')}${button('Print blank facilitation kit','print','class="primary"')}</div><h1 id="screenHeading" tabindex="-1">Paper investigation kit</h1><p>Complete teacher-facilitated alternative · invented records only · no names required</p><section class="panel"><h2>Facilitator guide</h2><p><strong>Mission:</strong> Help the fictional school garden team explain what its records support. Compare two records, offer a claim, then decide what another record changes.</p><ol><li>Print this blank kit. Keep the C sheet separate until learners request it. Offer speech, another language, a scribe, flexible turns, passing and dissent.</li><li>Present A/B and the opening record sheet. Ask neutrally: “What do these records say, and what does your claim add?” No suggestion has preferred status.</li><li>Introduce C: “Another fictional record may complicate the explanation. You can keep your position.” Choose A/B, A/C or B/C; compare using the sheet. No revision is required.</li><li>Choose which condition to hold constant, then use its W or L sheet. These are prepared examples, not scientific predictions. Practitioners may replace or reject them.</li><li>Review the later record, representation and dissent with people. Confirm or cancel exact proposals; do not silently change wording. Optionally use the other fixture and separate practice sheet.</li><li>For correction, retain identifiable original and correction only while the contribution remains active. Review before accepting; cancel leaves the current record intact. At most one agreed paper checkpoint may be kept for recovery. Review every field before restoration; consume the checkpoint without making reverse history.</li><li>For withdrawal, inspect affected initial lines, versions, relationships, initial pair, tracked copies and checkpoint. Ask people to identify other ambiguous later content; never infer ownership. Confirm scope, cancel unchanged, or pause disputed scope for facilitation. A confirmation does not prove authorization.</li><li>Replace affected sheets or use an agreed removal routine that makes affected wording unavailable in copies and checkpoint. Crossing out readable words is not removal. Close the initial slot; write only “Initial position withdrawn.” Dependent later records become “New position needed,” with their pair preserved. Preserve independent work, planning, practice, representation and dissent. Mark history incomplete. Sanitize or discard checkpoint before restoring; never reopen the initial slot.</li><li>During interruption, cover or set aside sheets. For handoff, arrange removal of work, drafts, copies and checkpoint. Paper custody, replacement, disposal and permission require human arrangements; browser clearing cannot control them. Paper-only delivery can be preferred.</li></ol><p class="small">No grades or consequential assessment. Science-practitioner, teacher, student and caregiver review, reading access, assistive-technology access, workload, pilots and learning evidence remain pending. Difficulty may reflect language, navigation, time or group control; apparent success may reflect suggestions or adult cues.</p></section><section class="paperpage"><h2>Sheet 1 · opening evidence A/B</h2><p>Invented 14-day story; not measurements, plant-care advice or real outcomes.</p>${pairView('AB')}</section><section class="paperpage"><h2>Sheet 2 · keep separate: reveal C</h2><p>Another fictional record may complicate the explanation. You can keep your position.</p>${card('C')}<h3>All available text comparisons</h3><p>A/B: ${differences.AB}<br>A/C: ${differences.AC}<br>B/C: ${differences.BC}</p><p>${unknown}</p><p>C challenges the universal descriptive water-2 claim without establishing an opposite causal rule.</p></section>${['W','L'].map(p=>`<section class="paperpage"><h2>Prepared sheet ${p} · ${p==='W'?'hold light constant; compare water':'hold water constant; compare light'}</h2>${pairView(p)}</section>`).join('')}<section class="paperpage"><h2>Record sheet · before / after</h2><p>Use no participant names. All fields can be spoken or scribed. Passing changes no contribution.</p><h3>Before: opening position</h3><p>Choose: □ B finishes taller than A in these records □ Water-2 plants always finish taller in this story □ These records do not settle what caused the height difference □ own wording □ withhold.</p><div class="blank"></div><p>□ Confirm A/B — only opening pair. Optional relationship: □ describes these records □ goes beyond these records □ connection undecided □ not selected.</p><p>Active original / correction (label versions; confirm or cancel):</p><div class="blank"></div><div class="blank"></div><h3>After: reconsideration</h3><p>Action: □ retain □ narrow □ revise □ withhold. Retain copies active initial wording and stays dependent even after editing. Narrow/revise require a deliberate wording choice. □ New independent later route selected (unverified independence).</p><p>Exact proposed later wording / withhold:</p><div class="blank"></div><p>Pair: □ A/B □ A/C □ B/C. Optional relationship: □ describes these records □ goes beyond these records □ connection undecided □ not selected.</p><p>Representation: □ one offered explanation □ agreed group explanation (selected, unverified) □ unresolved discussion. Independent dissent: □ present □ not marked. Agreement and dissent together call for neutral representation review.</p><p>Review exact wording, action, pair, relationship, representation and dissent: □ confirm □ cancel. Active correction:</p><div class="blank"></div><p>Planning choice: □ W (hold light; compare water) □ L (hold water; compare light). History: □ complete while active □ incomplete after withdrawal.</p><h3>Withdrawal scope / optional checkpoint</h3><p>□ Initial versions, relationship and bound pair □ tracked later copies □ additional affected later content identified orally □ checkpoint inspected. Recovery consequence: □ reduced scope □ discarded □ none. □ confirm scope □ cancel unchanged □ pause for facilitation. Removed words must become unavailable; do not preserve readable strike-through copies.</p><p>Content-free markers after removal: □ Initial position withdrawn (closed) □ New position needed; retained comparison pair: ______. Do not add a reason or identity. At most one checkpoint: □ none □ agreed current copy, subject to removal boundaries.</p></section><section class="paperpage"><h2>Separate optional practice sheet</h2><p>Use the other prepared fixture. Fewer suggestions; skippable supported practice, not evidence of transfer.</p><p>Fixture: □ W □ L. Choose: □ ${differences.W.split(';')[0]} in these records (W) □ ${differences.L.split(';')[0]} in these records (L) □ withhold □ oral own position.</p><div class="blank"></div><p>Optional relationship: □ describes these records □ goes beyond these records □ connection undecided □ not selected. Reconsideration: □ retain □ revise □ withhold. Withhold records no current claim. After changing a withheld position, explicitly choose the action before review. Retain refers to an existing active position in the same fixture. Review exact record: □ confirm □ cancel / skip.</p><p>Support arrangements, time and language access should be discussed without recording identities here. Facilitation, dissent and refusal remain legitimate routes.</p></section>`;}
function render(focus=false){const focused=document.activeElement;const focusKey=focused?.id?['id',focused.id]:focused?.dataset?.do?['do',focused.dataset.do]:focused?.dataset?.scope?['scope',focused.dataset.scope]:focused?.dataset?.field?['field',focused.dataset.field]:null;$('live').textContent='';const concealed=screen==='cover'||screen==='handoff';$('top').innerHTML=`<div><strong>EVIDENCE STUDIO</strong><br><small>Fictional garden investigation</small></div><nav class="toolbar" aria-label="Activity controls">${!concealed?button('Cover / pause','cover')+button('Review recovery','recovery',recovery&&screen!=='recovery'?'':'disabled'):''}${screen!=='handoff'?button('Handoff / clear work','handoff'):''}</nav>`;
let html;if(screen==='cover')html=`<div class="center"><span class="eyebrow">Activity covered</span><h1 id="screenHeading" tabindex="-1">Take a pause.</h1><p>Work is preserved in this page. Cover is not a lock; anyone can resume.</p>${button('Resume preserved activity','resume','class="primary"')}</div>`;else if(screen==='handoff')html=`<div class="center"><h1 id="screenHeading" tabindex="-1">Clear work for handoff?</h1><p>Confirmation removes all application-owned work, drafts, previews, recovery and withdrawal boundaries. The next group gets a fresh opening.</p><div class="actionbar">${button('Confirm handoff; clear all work','confirmHandoff','class="primary"')}${button('Cancel; return with work intact','cancelHandoff')}</div><p class="small">Clearing cannot control screenshots, browser history, autofill or device records.</p></div>`;else if(screen==='edit')html=edit();else if(screen==='review')html=proposal();else if(screen==='withdraw')html=withdrawalView();else if(screen==='recovery')html=recoveryView();else if(screen==='practice')html=practiceView();else if(screen==='practiceReview')html=practiceReview();else if(screen==='paper')html=paper();else html=activity();
$('app').innerHTML=(!concealed&&error?`<p class="error" role="alert">${esc(error)}</p>`:'')+html;if(focus){const h=$('screenHeading')||$('evidenceHeading');if(h){h.setAttribute('tabindex','-1');h.focus();}}else if(focusKey){const candidates=[...document.querySelectorAll('[id],[data-do],[data-field],[data-scope]')];const match=candidates.find(el=>focusKey[0]==='id'?el.id===focusKey[1]:el.dataset?.[focusKey[0]]===focusKey[1]);if(match&&!match.disabled)match.focus();}}
function handle(action){error='';const [a,arg]=action.split(':');
if(a==='initial')return beginInitial();if(a==='later')return beginLater(arg);if(a==='independent')return beginLater('Revise',true);if(a==='correctLater')return beginLater('Correct later',false,true);
if(a==='pair'){const n=clone(state);n.pair=arg;if(commit(n)){render();say('Comparison '+arg+' selected. Recorded wording and relationships are unchanged.');}return;}
if(a==='reveal'){const n=clone(state);n.reveal=true;if(commit(n)){render(true);say('Record C is available. You can keep your position.');}return;}
if(a==='plan'){const n=clone(state);n.plan=arg;if(commit(n)){render();say('Prepared comparison '+arg+' selected.');}return;}
if(a==='representation'){pending={target:'representation',rep:state.rep,dissent:state.dissent};screen='edit';}
if(a==='review'){if(pending.record&&(!pending.choice||!pending.record.pair||(pending.record.status==='active'&&!latest(pending.record).trim()))){error='Choose a position or withhold, and confirm the evidence pair. You can also pass.';}else screen='review';}
if(a==='confirm')return applyProposal();if(a==='backEdit')screen='edit';
if(a==='cancelEdit'||a==='cancelPass'){pending=null;screen='activity';}
if(a==='pass'){say('Passing changes no contribution. Oral and paper routes are available.');return;}
if(a==='draftAction'){const r=pending.record;if(arg==='Retain'){if(!active(state.initial))return;r.deps=[...new Set([...r.deps,state.initial.id])];r.versions.at(-1).text=latest(state.initial);r.status='active';pending.choice='own';r.route='copied';}else{pending.choice=arg==='Withhold'?'withhold':'';r.versions.at(-1).text='';r.status='withheld';}r.action=arg;}
if(a==='withdraw'){if(boundary.closed||!state.initial)return;withdrawal={from:screen,extra:[]};screen='withdraw';}
if(a==='cancelWithdrawal'){screen=withdrawal.from;withdrawal=null;}
if(a==='confirmWithdrawal')return withdrawNow();
if(a==='recovery'){if(!recovery||screen==='recovery')return;recoveryFrom=screen;screen='recovery';}
if(a==='cancelRecovery'){screen=recoveryFrom;recoveryFrom=null;}
if(a==='restore'){const n=sanitize(recovery);if(!n||failures(n).length){error='Recovery was stopped. Cancel or pause for facilitation.';}else{state=n;recovery=null;pending=null;withdrawal=null;recoveryFrom=null;screen='activity';}}
if(a==='cover'){coverFrom=screen;screen='cover';}
if(a==='resume'){screen=coverFrom;coverFrom=null;}
if(a==='handoff'){handoffFrom=screen;screen='handoff';}
if(a==='cancelHandoff'){screen=handoffFrom;handoffFrom=null;}
if(a==='confirmHandoff'){state=fresh();recovery=null;pending=null;withdrawal=null;boundary={closed:false,blocked:[]};coverFrom=null;handoffFrom=null;recoveryFrom=null;paperFrom=null;reviewer=false;serial=0;error='';screen='activity';$('app').replaceChildren();$('top').replaceChildren();$('live').textContent='';}
if(a==='practice'){const fixture=state.plan==='W'?'L':'W';pending={target:'practice',practice:state.practice?.fixture===fixture?clone(state.practice):{fixture,choice:'Not selected',rel:relationships[0],action:'Revise'}};screen='practice';}
if(a==='reviewPractice'){error=practiceIssue(pending.practice);screen=error?'practice':'practiceReview';}
if(a==='backPractice')screen='practice';
if(a==='confirmPractice'){error=practiceIssue(pending.practice);if(error)screen='practice';else{const n=clone(state);n.practice=clone(pending.practice);if(commit(n)){pending=null;screen='activity';}}}
if(a==='paper'){paperFrom=screen;screen='paper';}
if(a==='returnPaper'){screen=paperFrom;paperFrom=null;}
if(a==='print'){window.print();return;}
if(a==='diagnostics')reviewer=!reviewer;
render(a!=='draftAction'&&a!=='diagnostics');if(a==='cancelPass')say('Passed without changing committed work.');}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-do]');if(b&&!b.disabled)handle(b.dataset.do);});
document.addEventListener('input',e=>{const field=e.target.dataset.field;if(field==='wording'&&pending?.record){pending.record.versions.at(-1).text=e.target.value;pending.record.status='active';}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.scope&&withdrawal){withdrawal.extra=t.checked?[...new Set([...withdrawal.extra,t.dataset.scope])]:withdrawal.extra.filter(x=>x!==t.dataset.scope);render();return;}const f=t.dataset.field;if(!f||!pending)return;if(f==='wording')return;if(f==='rep')pending.rep=t.value;if(f==='dissent')pending.dissent=t.checked;if(f==='choice'){if(pending.target==='later'&&t.value==='withhold')pending.record.action='Withhold';pending.choice=t.value;pending.record.versions.at(-1).text=t.value==='own'||t.value==='withhold'||!t.value?'':t.value;pending.record.status=t.value==='withhold'||!t.value?'withheld':'active';}if(f==='openingPair')pending.record.pair=t.checked?'AB':null;if(f==='pair')pending.record.pair=t.value;if(f==='rel')pending.record.rel=t.value;if(f==='practiceChoice'||f==='practiceAction')changePractice(f,t.value);if(f==='practiceRel')pending.practice.rel=t.value;render();});
render();
</script></body></html>
