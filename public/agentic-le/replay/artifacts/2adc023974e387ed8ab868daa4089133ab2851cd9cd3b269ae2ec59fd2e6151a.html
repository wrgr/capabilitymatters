<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'"><style>select,input,textarea{max-width:100%;min-width:0}body{overflow-wrap:anywhere}:focus-visible{outline:3px solid #155f6f;outline-offset:3px}</style>

<style>
:root{--ink:#172b39;--muted:#4d626d;--paper:#f6f5ef;--white:#fff;--line:#d5dedb;--teal:#176b66;--soft:#e7f2ee;--amber:#6b4718;--sand:#fff1d9;--navy:#112f3d;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:.65rem 1rem;min-height:44px;font-weight:650}button:hover{background:#eef3f1}button.primary{background:var(--teal);border-color:var(--teal);color:white}button.primary:hover{background:#125651}button.danger{color:#8a3431;border-color:#b66c66}button:disabled{cursor:not-allowed;opacity:.5}a{color:var(--teal)}:focus-visible{outline:3px solid #ae571a;outline-offset:4px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.09;letter-spacing:-.045em;margin-bottom:1.1rem}h2{font-size:1.5rem;line-height:1.2;letter-spacing:-.025em}h3{font-size:1.08rem;line-height:1.3;margin-bottom:.6rem}p{margin-bottom:1rem}small,.small{font-size:.88rem}.muted{color:var(--muted)}.eyebrow{font-size:.76rem;text-transform:uppercase;letter-spacing:.12em;font-weight:750;color:var(--teal);margin-bottom:.55rem}.fiction{display:inline-block;font-size:.78rem;font-weight:650;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:.12rem .45rem;background:#fafcfb}.wrap{max-width:1160px;margin:auto;padding:0 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;border-bottom:1px solid var(--line)}.brand{font-weight:780;letter-spacing:-.03em;font-size:1.15rem}.brand span{color:var(--teal)}.nav{display:flex;flex-wrap:wrap;gap:6px}.nav button{font-size:.84rem;padding:.45rem .65rem}.skip{position:absolute;top:-100px;left:16px;background:white;padding:10px;z-index:9}.skip:focus{top:8px}main{padding:32px 0 54px}.hero{display:grid;grid-template-columns:1.13fr 1fr;gap:36px;align-items:center;padding:24px 0 34px}.hero p{font-size:1.08rem;max-width:58ch}.scene{background:var(--navy);color:white;border-radius:var(--radius);padding:20px}.scene svg{width:100%;height:auto;display:block}.scene p{font-size:.85rem;color:#d0e4e4;margin:12px 0 0}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:18px}.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:20px}.panel.tint{background:var(--soft)}.panel.warning{background:var(--sand);border-color:#d6b883}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid .panel,.two .panel{margin-bottom:0}.stack{display:grid;gap:20px}.board{margin:24px 0}.board .panel{padding:20px}.board ul{padding-left:20px;margin:0}.board li+li{margin-top:10px}.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:20px;background:#edf2ef;color:var(--muted);margin-bottom:12px}.tag.amber{background:var(--sand);color:var(--amber)}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.steps span{padding:7px 12px;border-radius:8px;background:#e8ece8;color:var(--muted);font-size:.83rem}.steps .active{background:var(--navy);color:white}.section-head{display:flex;justify-content:space-between;align-items:start;gap:16px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{display:flex;align-items:flex-start;gap:10px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fafcfb;cursor:pointer}.choice:has(input:checked){border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);background:var(--soft)}.choice input{accent-color:var(--teal);margin-top:6px;flex:0 0 auto;width:18px;height:18px}.choice b{display:block;margin-bottom:5px}.choice small{display:block;color:var(--muted)}fieldset{border:0;padding:0;margin:20px 0}legend{font-weight:750;margin-bottom:10px}.line-choice{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.dialogue{padding:18px 20px;border-left:4px solid var(--teal);background:#f0f6f4;margin:16px 0}.dialogue blockquote{margin:10px 0;font-size:1.03rem}.dialogue cite{font-style:normal;font-weight:650;font-size:.85rem}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.toolbar select{max-width:100%}.notice{border-radius:10px;padding:12px 15px;background:#edf3f1;font-size:.9rem;margin:12px 0}.notice.conflict{background:var(--sand);border:1px solid #d6b883}.support{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.support label{font-size:.85rem;font-weight:700}.support select{width:100%;margin:7px 0;border:1px solid #adbeb7;border-radius:8px;padding:10px;color:var(--ink);background:white;min-height:44px}.support small{display:block;font-weight:400;color:var(--muted)}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.summary span{background:#edf3f0;padding:6px 9px;border-radius:7px;font-size:.8rem;font-weight:650}.summary .conflict{background:var(--sand);color:var(--amber)}dl{margin:0}dt{font-size:.79rem;letter-spacing:.04em;text-transform:uppercase;font-weight:750;color:var(--muted);margin-top:17px}dt:first-child{margin-top:0}dd{margin:5px 0 0;overflow-wrap:anywhere}.plan h3{font-size:1.27rem}.plan .version{font-size:.77rem;font-weight:750;text-transform:uppercase;color:var(--teal);margin-bottom:5px}.plan .authored{font-size:.76rem;color:var(--muted)}.edit label{display:block;font-weight:700;margin-bottom:6px}.edit input,.edit textarea,.edit select{width:100%;border:1px solid #a8bbb3;border-radius:8px;padding:10px;background:white;color:var(--ink)}.edit textarea{min-height:100px;resize:vertical}.edit .field{margin:14px 0}.review{border:2px solid var(--teal);border-radius:12px;padding:18px;background:#f2f8f5}.review.stale{border-color:#ac792f;background:var(--sand)}.exact{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:white;border:1px solid var(--line);border-radius:8px}.neutral{max-width:680px;margin:8vh auto;padding:30px;background:white;border:1px solid var(--line);border-radius:var(--radius)}.neutral h1{font-size:2.4rem}.neutral .icon{width:58px;height:58px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin-bottom:20px;font-size:1.6rem}.footer{padding:22px 0;border-top:1px solid var(--line);font-size:.83rem;color:var(--muted)}.help,.paper{max-width:900px;margin:auto}.help details{border:1px solid var(--line);border-radius:12px;margin:14px 0;background:white;padding:16px}.help summary{cursor:pointer;font-weight:750;min-height:30px}.help details p:first-of-type{margin-top:14px}.paper .card{border:1px dashed #9eafa7;background:white;border-radius:10px;padding:18px;margin:14px 0;break-inside:avoid}.paper ol{padding-left:24px}.paper li+li{margin-top:12px}.blank{height:37px;border-bottom:1px solid #899a92}.paper-sheet{display:grid;grid-template-columns:1fr 1fr;gap:20px}.paper-sheet dt{margin-top:13px}.paper-sheet dd{min-height:38px;border-bottom:1px solid #99aaa2}.mini{font-size:.85rem}.status{min-height:1.5rem;font-size:.88rem;color:var(--teal);margin:12px 0}.locked{padding:15px;background:#eee; border-radius:10px;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:850px){.top{align-items:start;flex-direction:column}.hero{grid-template-columns:1fr;gap:18px}.hero .scene{max-width:600px}.grid,.choice-grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.support{grid-template-columns:1fr 1fr}.wrap{padding:0 18px}main{padding-top:22px}.panel{padding:19px}.paper-sheet{grid-template-columns:1fr}}@media(max-width:450px){.line-choice,.support{grid-template-columns:1fr}.nav{gap:5px}.nav button{padding:.4rem .55rem}.section-head{flex-direction:column}.neutral{padding:22px;margin:5vh 0}.actions button{width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}@media print{.top,.footer,.actions,.skip{display:none}.wrap{max-width:none;padding:0}main{padding:0}.paper .card{border-color:#555}body{background:white;color:black}.paper h1{font-size:28pt}.paper h2{font-size:19pt}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const app = document.getElementById('app');
const openingTexts = {
 inquiry:'I noticed Monday’s handoff note was absent. What was happening from your perspective?',
 process:'Can we check how the handoff was meant to work on Monday?',
 wait:'I need more context before deciding our next step.'
};
const interpretations = {
 unknown:'I do not yet have an explanation.',
 workflow:'The workflow may have made the note difficult to complete.',
 missed:'The note may have been overlooked.',
 careless:'Carelessness is one possible explanation; it is not an observed cause.'
};
const nextNames = {template:'Explore a shared template step',clarify:'Check expectations and ownership',pause:'Pause until a suitable opportunity'};
const supportNames = {access:'Template access',authority:'Relevant authority',time:'Protected time',coverage:'Shift coverage'};
const componentNames = {observation:'Observation',invitation:'Invitation',next:'Next move'};
function freshSession(){return {opening:'inquiry',interpretation:'unknown',next:'template',response:'context',rejected:false,initial:null,revealed:false,withdrawn:false,routeChoice:'',accessOffered:false,support:{access:'unknown',authority:'unknown',time:'unknown',coverage:'unknown'},overrides:{},question:'',draft:{component:'invitation',replacement:'',question:''},review:null,conditionVersion:0,second:{started:false,opening:'account',next:'map',applied:false}};}
function freshUI(){return {view:'start',returnTo:'start',coverReturn:'start',clearReturn:'start',stopReturn:'main',stopKind:'stop',orientation:false,status:''};}
let session = freshSession();
let ui = freshUI();
function esc(value){return String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function button(action,label,kind='',extra=''){return `<button type="button" data-action="${action}" ${extra} class="${kind}">${label}</button>`;}
function capacity(support){if(support.time==='unavailable'||support.coverage==='unavailable')return 'unavailable';if(support.time==='available'&&support.coverage==='available')return 'available';return 'unknown';}
function snapshot(){return {opening:session.opening,interpretation:session.interpretation,next:session.next,support:{...session.support},overrides:{...session.overrides},question:session.question,revealed:session.revealed,withdrawn:session.withdrawn,accessOffered:session.accessOffered,routeChoice:session.routeChoice};}
function agreement(p){return p.withdrawn?'withheld for the additional work; no later agreement supplied':'unresolved; the colleague has not agreed';}
function authoredNext(p){
 if(p.next==='pause')return 'Pause the proposal. Ask whether a suitable time and format can be arranged; no meeting or work is assigned.';
 if(p.next==='clarify')return p.withdrawn?'Request clarification of ownership, protected time and coverage. Leave additional work unassigned; the recorded refusal remains.':'Ask how the handoff was meant to work and who is expected to own each step. Request clarification before assigning work.';
 if(p.withdrawn)return 'Ask the appropriate workflow owner to clarify protected time, coverage and ownership before discussing a template step. Leave additional work unassigned; do not promise after-shift completion.';
 return 'Explore a template step only if access, relevant authority, protected time, coverage and reciprocal agreement can be established. Leave the work unassigned until those conditions are resolved.';
}
function authoredObservation(p){return 'Monday’s handoff note was absent. The next shift repeated a check. The causal relationship between these observations is unknown.';}
function authoredInvitation(p){return openingTexts[p.opening];}
function valueFor(p,key){if(Object.prototype.hasOwnProperty.call(p.overrides,key))return p.overrides[key];return key==='observation'?authoredObservation(p):key==='invitation'?authoredInvitation(p):authoredNext(p);}
function unresolved(p){let out=['The colleague’s full account and the repeated check’s cause remain unknown.','Expected ownership and agreement remain unresolved.'];if(p.next==='template'||p.withdrawn)out.push('Who can secure access, protected time and coverage, and authorize the proposed work?');if(p.withdrawn)out.push('The colleague refused additional after-shift work. No later agreement is supplied.');if(p.question)out.push('Participant question (verbatim): '+p.question);return out;}
function supportSummary(p){return `<div class="summary"><span>Access: ${esc(p.support.access)}${p.accessOffered?' · offer recorded':''}</span><span>Authority: ${esc(p.support.authority)}</span><span class="${capacity(p.support)==='unavailable'?'conflict':''}">Protected capacity: ${capacity(p.support)}</span><span class="${p.withdrawn?'conflict':''}">Agreement: ${p.withdrawn?'withheld':'unresolved'}</span></div>`;}
function plan(p,label){return `<article class="panel plan"><p class="version">${label}</p><h3>${p.next==='template'?'A conditional template proposal':p.next==='clarify'?'An inquiry into ownership':'A pause proposal'}</h3><p class="fiction">Fictional practice proposal</p><p class="small muted">No workplace agreement or capability judgment.</p><dl><dt>Observation ${p.overrides.observation!==undefined?'· participant wording':''}</dt><dd>${esc(valueFor(p,'observation'))}</dd><dt>Invitation ${p.overrides.invitation!==undefined?'· participant wording':''}</dt><dd>${esc(valueFor(p,'invitation'))}</dd><dt>Tentative interpretation</dt><dd>${esc(interpretations[p.interpretation])} Selecting it does not establish a cause.</dd><dt>Next move ${p.overrides.next!==undefined?'· participant wording':''}</dt><dd>${esc(valueFor(p,'next'))}</dd><dt>Independent feasibility conditions</dt><dd>${supportSummary(p)}<span class="small">Time: ${esc(p.support.time)}. Coverage: ${esc(p.support.coverage)}. Relevant authority means authority to clarify ownership and arrange the proposed support; its scope still needs checking.</span></dd><dt>Agreement and unassigned work</dt><dd>Agreement is ${esc(agreement(p))}. Additional handoff work remains unassigned.${p.accessOffered?' Restored access has been offered, not confirmed.':''}</dd><dt>Unresolved questions / disagreement</dt><dd>${unresolved(p).map(x=>`<p class="small">${esc(x)}</p>`).join('')}</dd></dl>${Object.keys(p.overrides).length?'<p class="notice">Participant wording is displayed verbatim. The candidate cannot certify its feasibility; independent conditions above still apply.</p>':''}<p class="authored">${p.revealed?'Reveal retained: rota changed; Monday’s template inaccessible; expected owner unclear.':'The colleague’s account has not been heard.'}${p.withdrawn?' History retained: capacity withdrawn and agreement withheld.':''}</p></article>`;}
function nav(){return `<header class="top"><div class="brand">Conversation<span> / </span>Lab</div><nav class="nav" aria-label="Session controls">${button('pass','Pass')}${button('stop','Stop')}${button('cover','Cover')}${button('paper','Paper activity')}${button('help','Help')}${button('clear','Finish & clear')}</nav></header>`;}
function shell(body,withNav=true){return `<button type="button" class="skip" data-action="skip">Skip to content</button><div class="wrap">${withNav?nav():`<header class="top"><div class="brand">Conversation<span> / </span>Lab</div><span class="fiction">Fictional rehearsal</span></header>`}<main id="content" tabindex="-1">${body}</main><footer class="footer">Voluntary fictional practice · No scores or recordings · Work lasts only in this open page. Refreshing or closing loses it.</footer></div>`;}
function scene(){return `<div class="scene"><svg viewBox="0 0 470 215" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">Two observed events, an unheard account</title><desc id="scene-desc">Monday: handoff note absent. Next shift: a check repeated. A colleague’s account is missing. Timeline order does not establish causation.</desc><path d="M50 108H414" stroke="#659f9b" stroke-width="2" stroke-dasharray="5 6"/><rect x="20" y="35" width="132" height="142" rx="14" fill="#e9f3ee"/><rect x="169" y="35" width="132" height="142" rx="14" fill="#e9f3ee"/><rect x="318" y="35" width="132" height="142" rx="14" fill="#264b58" stroke="#91bcb7"/><g fill="#173640" font-family="system-ui,sans-serif" font-size="13"><text x="35" y="60" font-weight="700">MONDAY</text><text x="184" y="60" font-weight="700">NEXT SHIFT</text><text x="35" y="141">Handoff note</text><text x="35" y="159" font-weight="700">absent</text><text x="184" y="141">Check</text><text x="184" y="159" font-weight="700">repeated</text></g><path d="M62 76h38v42H62zM69 88h24M69 98h17" stroke="#176b66" stroke-width="2" fill="none"/><circle cx="232" cy="96" r="20" fill="none" stroke="#176b66" stroke-width="2"/><path d="M222 96l7 7 14-16" fill="none" stroke="#176b66" stroke-width="3"/><g fill="#e9f3ee" font-family="system-ui,sans-serif" font-size="13"><text x="333" y="60" font-weight="700">STILL MISSING</text><text x="333" y="141">Colleague’s</text><text x="333" y="159" font-weight="700">account</text><text x="372" y="112" text-anchor="middle" font-size="36">?</text></g><text x="235" y="205" fill="#d0e4e4" text-anchor="middle" font-size="12" font-family="system-ui,sans-serif">Sequence is visible. Cause is not established.</text></svg><p>Invented situation. No employee records or evidence about real people.</p></div>`;}
function startPage(){return `<section class="hero"><div><p class="eyebrow">First-time team lead practice</p><h1>A missing note.<br>An unheard account.</h1><p>Your mission: prepare an observation, an invitation and a feasible shared next move. Inspect what changes when workflow support and agreement are missing.</p><p class="fiction">Invented missed-handoff story</p><div class="actions">${button('begin','Begin with the situation','primary')}${button('paper','Use the paper activity')}${button('help','Review Help')}</div><p class="small muted" style="margin-top:16px">Choices are ready to inspect. Writing and speaking are optional. You may pass or stop without a reason.</p></div>${scene()}</section><div class="two"><section class="panel"><h2>Your choices remain yours</h2><p>Keep or revise, reject examples, leave questions unresolved or pause. No person is evaluated.</p></section><section class="panel"><h2>Before you begin</h2><p>Use fictional content only. Work stays in this page’s volatile memory; refresh or closure loses it. Cover conceals and retains work. Finish & clear removes the candidate’s session after confirmation.</p><p class="small muted">Arrange participation, space and protected time with accountable humans. None are secured here.</p></section></div>`;}
function board(){return `<section class="board" aria-label="Situation board"><div class="section-head"><h2>Separate the story from the explanation</h2><span class="fiction">Fictional source facts</span></div><div class="grid"><article class="panel"><span class="tag">Observed facts</span><ul><li>Monday’s handoff note was absent.</li><li>The next shift repeated a check.</li></ul><p class="small muted" style="margin-top:14px">These observations do not prove that the absent note caused the repeated check.</p></article><article class="panel"><span class="tag">Possible explanations</span><ul><li>A changed rota or conflicting expectations.</li><li>Unavailable materials or unclear ownership.</li><li>A missed note or other context.</li></ul><p class="small muted" style="margin-top:14px">Each remains tentative, including your selection.</p></article><article class="panel"><span class="tag amber">Missing context</span><ul><li>The colleague’s complete account.</li><li>What caused the repeated check.</li><li>Who owned the note and what support existed.</li></ul></article></div></section>`;}
function radio(name,value,title,description,current){return `<label class="choice"><input type="radio" name="${name}" value="${value}" data-focus="${name}-${value}" ${current===value?'checked':''}><span><b>${title}</b><small>${description}</small></span></label>`;}
function openingSection(){return `<section class="panel"><h2>Choose an opening</h2><p class="muted">Each opens a different authored possibility. Try another, or reject the example; none predicts a real colleague’s response.</p><fieldset><legend>Exact opening previews</legend><div class="choice-grid">${radio('opening','inquiry','Start with an observation',esc(openingTexts.inquiry),session.opening)}${radio('opening','process','Ask about the process',esc(openingTexts.process),session.opening)}${radio('opening','wait','Hold the decision',esc(openingTexts.wait),session.opening)}</div></fieldset>${dialogue()}</section>`;}
function dialogue(){const lines={inquiry:{context:'“I can share what I understood the handoff to involve.”',question:'“Are you assuming the missing note caused the repeated check?”',later:'“I would prefer to discuss this later.”'},process:{context:'“The instructions I saw did not make the owner clear.”',question:'“Which expectation are we checking, and who set it?”',later:'“Can we choose a different time to go through the process?”'},wait:{context:'“I have context to add before we decide anything.”',question:'“What information would you need before making that decision?”',later:'“I would prefer to leave this conversation for now.”'}};
 const feedback={inquiry:'This wording names the absent note and asks for the colleague’s perspective. It does not establish who was responsible or what caused the repeated check.',process:'This wording puts the expected process under examination. The relevant expectation, its owner and the colleague’s account are still missing.',wait:'This wording postpones a decision. It does not arrange a suitable opportunity or secure the colleague’s agreement.'};
 return `<div class="toolbar"><label for="response" class="small">Try a possible response</label><select id="response" data-focus="response" name="response"><option value="context" ${session.response==='context'?'selected':''}>Offers context</option><option value="question" ${session.response==='question'?'selected':''}>Questions the interpretation</option><option value="later" ${session.response==='later'?'selected':''}>Asks to discuss it later</option></select></div><div class="dialogue"><span class="fiction">Authored fictional possibility · not a prediction</span><p class="small" style="margin-top:12px"><b>Lead opening:</b> ${esc(openingTexts[session.opening])}</p><blockquote>${esc(lines[session.opening][session.response])}</blockquote><cite>Invented colleague response</cite><p class="small" style="margin-top:14px"><b>Descriptive feedback:</b> ${esc(feedback[session.opening])}</p></div>${button('reject',session.rejected?'Use the example again':'Reject this example / feedback')} ${session.rejected?'<p class="notice">Example and feedback rejected. Your proposal and choices remain available; rejection has no score or capability meaning.</p>':''}`;
}
function planningChoices(){return `<section class="panel"><h2>${session.initial?'Retain or reconsider':'Make a provisional plan'}</h2><p class="muted">Starter choices are editable. Change is not a success signal.</p><fieldset><legend>Tentative interpretation</legend><div class="line-choice">${radio('interpretation','unknown','No explanation yet','Keep the cause unresolved.',session.interpretation)}${radio('interpretation','workflow','Workflow may be involved','An explanation to examine, not a finding.',session.interpretation)}${radio('interpretation','missed','The note may have been overlooked','Responsibility and cause remain unknown.',session.interpretation)}${radio('interpretation','careless','Carelessness is possible','A tentative interpretation, never an observed cause.',session.interpretation)}</div></fieldset><fieldset><legend>Provisional next move</legend><div class="choice-grid">${radio('next','template',nextNames.template,'Conditional on access, authority, protected capacity and agreement.',session.next)}${radio('next','clarify',nextNames.clarify,'Ask what was expected and who can resolve it.',session.next)}${radio('next','pause',nextNames.pause,'Leave the proposal unassigned and a suitable opportunity unarranged.',session.next)}</div></fieldset>${session.overrides.next!==undefined?'<p class="notice">The next-move choice supplies descriptive context. Your applied replacement wording remains verbatim until you explicitly replace or restore it.</p>':''}${!session.initial?`<div class="actions">${button('capture','Record the initial proposal','primary')}</div><p class="small muted" style="margin-top:12px">Capture this version before new fictional context is revealed. No agreement is recorded.</p>`:''}</section>`;}
function contextSection(){if(!session.initial)return '';if(!session.revealed)return `<section class="panel tint"><h2>Your initial proposal is recorded</h2><p>Keep this before version visible. The next card adds fictional context; it does not prove a complete cause.</p>${button('reveal','Reveal the additional context','primary')}</section>`;return `<section class="panel tint"><div class="section-head"><h2>New context, still an incomplete account</h2><span class="fiction">Supplied fictional reveal</span></div><div class="grid"><p><b>The rota changed.</b><br>The schedule was different.</p><p><b>The template was inaccessible.</b><br>The colleague could not access it on Monday.</p><p><b>The expected owner was unclear.</b><br>Responsibility was unresolved.</p></div><p class="small">Retain or revise. Added context proves neither cause nor agreement.</p></section>`;}
function supportControls(){if(!session.revealed||!(session.next==='template'||session.withdrawn))return '';return `<section class="panel"><h2>What would this move depend on?</h2><p>Inspect each condition separately. These choices are <b>fictional prospective assumptions</b>, not verified resources. Available access alone cannot make a plan feasible.</p><div class="support">${Object.keys(supportNames).map(k=>`<label for="support-${k}">${supportNames[k]}<select id="support-${k}" name="support-${k}" data-focus="support-${k}">${['unknown','available','unavailable'].map(v=>`<option value="${v}" ${session.support[k]===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select><small>${k==='authority'?'Who can clarify ownership and arrange this support? Scope still needs checking.':k==='access'?'An offer is distinct from confirmed availability.':k==='time'?'Time within an agreed, protected arrangement.':'Someone must cover the shift work.'}</small></label>`).join('')}</div>${supportSummary(snapshot())}<p class="small">Capacity: unavailable if either component is unavailable; unknown if one is unknown. Agreement stays separate.</p>${session.withdrawn?'<p class="notice conflict">Prospective changes preserve Monday’s barrier, withdrawal and refusal. Work is unassigned; no later agreement is supplied.</p>':''}</section>`;}
function withdrawalCard(){if(!session.revealed)return '';if(!session.initial||session.initial.next!=='template')return `<section class="panel"><h2>Changed-condition card</h2><p class="small muted">This card requires a template initial plan. Yours uses another route; finish it or confirm clearing to try a fresh template plan.</p></section>`;if(!session.withdrawn)return `<section class="panel warning"><span class="fiction">Hypothetical changed condition</span><h2>Test the support beneath your plan</h2><p>A fictional manager is about to offer access on a condition. You can reveal this card while an exact correction review is pending, to inspect how new conditions affect it.</p>${button('withdraw','Reveal the manager’s condition','primary')}</section>`;return `<section class="panel warning"><span class="fiction">Hypothetical event and authored response · not a prediction</span><h2>Access is offered. Capacity is withdrawn.</h2><p>An authorized fictional manager offers restored access <b>if the colleague completes the note after their shift</b>. Protected time and coverage have been withdrawn. Ownership remains unresolved.</p><p class="notice conflict"><b>Access offered; protected capacity unavailable; colleague agreement withheld; ownership unresolved.</b><br>This is the recorded event. Later prospective choices do not erase it.</p><div class="dialogue"><cite>Authored fictional refusal</cite><blockquote>“Making the template accessible does not give me time to complete it after my shift. I cannot agree to that extra work.”</blockquote></div><p>The offer does not confirm access, supply protected capacity or establish agreement. Additional work stays unassigned.</p><div class="actions">${button('route-clarify','Request capacity & ownership clarification')}${button('route-reconsider','Reconsider the next move')}${button('route-pause','Pause')}</div>${session.routeChoice?`<p class="notice">${session.routeChoice==='clarify'?'Clarification route selected. No support or agreement is assumed.':session.routeChoice==='reconsider'?'Reconsideration selected. Retain your wording or use the choices and correction area; the conflict remains independently visible.':'Pause selected. No work or suitable meeting time has been assigned.'}</p>`:''}</section>`;}
function correctionSection(){if(!session.initial)return '';const r=session.review;return `<section class="panel edit"><h2>Correct one component, then review</h2><p>Optional fictional content. Review exact text before a separate Apply decision; conditions remain visible even if wording contradicts them.</p><div class="field"><label for="component">Component to replace</label><select id="component" name="component" data-focus="component">${Object.keys(componentNames).map(k=>`<option value="${k}" ${session.draft.component===k?'selected':''}>${componentNames[k]}</option>`).join('')}</select></div><div class="field"><label for="replacement">Replacement wording <span class="small muted">(optional)</span></label><textarea id="replacement" name="replacement" data-focus="replacement" maxlength="800" placeholder="Use fictional wording only; leave blank to keep the component.">${esc(session.draft.replacement)}</textarea><p class="small muted">Up to 800 characters. No analysis, scoring or feasibility certification of your text.</p></div><div class="field"><label for="question">One unresolved question <span class="small muted">(optional)</span></label><input id="question" name="question" data-focus="question" maxlength="300" value="${esc(session.draft.question)}" placeholder="Fictional question; leave blank to keep any existing question."></div><div class="actions">${button('review','Review the exact proposed correction','primary')}${button('discard','Discard the draft')}${Object.keys(session.overrides).length?button('restore','Review restoring authored wording'):''}${session.question?button('remove-question','Review removing the added question'):''}</div><div id="review-area">${r?reviewHTML(r):'<p class="small muted" style="margin-top:14px">Reviewing alone changes nothing. Cancel preserves your current proposal and all revealed conditions.</p>'}</div></section>`;}
function reviewHTML(r){const stale=r.stale||r.version!==session.conditionVersion;return `<section class="review ${stale?'stale':''}" aria-label="Exact correction review"><h3>${stale?'Review stale — inspect updated conditions':'Exact proposed correction'}</h3>${stale?'<p>Conditions or wording changed; draft retained. Review again to enable a separate Apply decision.</p>':''}<p><b>Affected component:</b> ${r.kind==='restore'?'All participant replacements; original authored wording will return':r.kind==='remove-question'?'Added unresolved question':esc(componentNames[r.component])}</p>${r.kind==='restore'?`<div class="exact">${['observation','invitation','next'].map(k=>`<b>${componentNames[k]}:</b> ${esc(k==='observation'?authoredObservation(snapshot()):k==='invitation'?authoredInvitation(snapshot()):authoredNext(snapshot()))}`).join('<br><br>')}</div>`:r.kind==='remove-question'?'<div class="exact">The participant-added question will be removed. Authored unresolved questions remain.</div>':`<p class="small">Replacement ${r.replacement.trim()?'(verbatim)':'(none; keep the current component)'}</p><div class="exact">${esc(r.replacement.trim()?r.replacement:valueFor(snapshot(),r.component))}</div><p class="small">Unresolved question ${r.question.trim()?'(verbatim)':'(none; keep the existing question)'}</p><div class="exact">${esc(r.question.trim()?r.question:(session.question||'No participant question added.'))}</div>`}<p class="small"><b>${stale?'Updated independent conditions; renewed inspection required':'Conditions at this review'}:</b></p>${supportSummary(stale?snapshot():r.conditions)}<p class="small">Agreement: ${esc(agreement(stale?snapshot():r.conditions))}. Work remains unassigned. ${session.withdrawn?'Monday’s history and the withdrawal/refusal are preserved.':''}</p><div class="actions">${button('apply','Apply this reviewed correction','primary',stale?'disabled':'')}${button('cancel-review','Cancel review')}${stale?button('renew','Review again with current conditions'):''}</div></section>`;}
function comparison(){if(!session.initial)return '';const p=snapshot();let changes=[];if(p.opening!==session.initial.opening)changes.push('opening selection');if(p.interpretation!==session.initial.interpretation)changes.push('tentative interpretation');if(p.next!==session.initial.next)changes.push('next-move route');if(Object.keys(p.overrides).length)changes.push('participant wording');if(p.question)changes.push('participant question');if(p.revealed)changes.push('added fictional context');if(p.withdrawn)changes.push('capacity withdrawal and withheld agreement');if(JSON.stringify(p.support)!==JSON.stringify(session.initial.support))changes.push('prospective support choices');return `<section aria-label="Before and after synthesis"><div class="section-head"><h2>Before / after: a plan you can inspect</h2><span class="fiction">No capability inference</span></div><p class="notice">${changes.length?'Recorded differences: '+esc(changes.join('; '))+'.':'The choices and wording are retained.'} ${p.opening===session.initial.opening&&p.interpretation===session.initial.interpretation&&p.next===session.initial.next?'Your opening, interpretation and route selections are retained.':''} Revision itself is not a success judgment.</p><div class="two">${plan(session.initial,'Initial proposal · before the reveal')}${plan(p,'Current proposal · constraints visible')}</div><div class="actions">${button('second','Optional second situation')}${button('clear','Finish & clear for handoff')}</div><p class="small muted" style="margin-top:12px">Questions and disagreement may stay unresolved. This tool cannot authorize repairs or a workplace conversation.</p></section>`;}
function mainPage(){return `<p class="eyebrow">Mission / prepare a feasible conversation proposal</p><div class="section-head"><h1 style="font-size:clamp(1.9rem,4vw,2.9rem)">${session.revealed?'Reconsider the support, not just the words.':'Start with what you know.'}</h1><span class="fiction">Invented Monday handoff</span></div><p class="muted">Observe, invite an account, and choose a next move. Leave cause and agreement unresolved where needed.</p><div class="steps" aria-label="Task progress"><span class="${!session.initial?'active':''}">1 · Inspect & record</span><span class="${session.initial&&!session.revealed?'active':''}">2 · Reveal context</span><span class="${session.revealed?'active':''}">3 · Review & synthesize</span></div>${ui.orientation?'<p class="notice">Orientation: your fictional selections, current wording and draft are retained. The recorded context and any refusal remain visible below. No recall task is required.</p>':''}<p class="status" role="status">${esc(ui.status)}</p>${board()}${contextSection()}${openingSection()}${planningChoices()}${supportControls()}${withdrawalCard()}${correctionSection()}${comparison()}`;}
function secondPage(){const s=session.second;const opens={account:'What did each shift understand about ownership of the final checklist check?',expectation:'Can we clarify who was expected to own the final checklist check?',pause:'Let’s leave a decision open until both shifts can add their accounts.'};const nexts={map:'Ask both shifts to describe their expected role, then request an explicit ownership arrangement from the appropriate workflow owner. No work or agreement is assigned.',clarify:'Ask the workflow owner to clarify the expectation and what protected time and coverage the final check needs. Both shifts’ accounts and agreement remain unresolved.',pause:'Pause assignment of the final check until the affected shifts can contribute and authority, protected time and coverage can be clarified.'};return `<section class="panel"><p class="eyebrow">Optional / supported practice</p><h1 style="font-size:2.4rem">Who owns the final check?</h1><p class="fiction">Separate fictional situation · no transfer test</p><p style="font-size:1.2rem;margin-top:16px">Two shifts each understood the other to own the final checklist check.</p><p class="muted">No Monday template barrier, access offer, refusal or capacity withdrawal is supplied here. The two shifts’ complete accounts are unknown.</p><fieldset><legend>Opening direction</legend><div class="choice-grid">${radio('second-opening','account','Hear both accounts','Ask what each shift understood.',s.opening)}${radio('second-opening','expectation','Clarify the expectation','Ask which ownership arrangement was intended.',s.opening)}${radio('second-opening','pause','Hold the decision','Leave room for missing accounts.',s.opening)}</div></fieldset><fieldset><legend>Next-move direction</legend><div class="choice-grid">${radio('second-next','map','Map the roles','Keep work unassigned.',s.next)}${radio('second-next','clarify','Request clarification','Check authority and support.',s.next)}${radio('second-next','pause','Pause','Leave agreement unresolved.',s.next)}</div></fieldset><div class="actions">${button('second-plan','Show this separate proposal','primary')}${button('second-help','Show optional wording help')}${button('return-main','Return to Monday’s proposal')}</div>${s.help?`<div class="notice"><b>Optional opening suggestion:</b> ${esc(opens[s.opening])}<p class="small" style="margin-top:10px">This is authored fictional wording, not a predicted response or a preferred answer. Help use is not recorded for evaluation.</p></div>`:''}</section>${s.applied?`<section class="panel tint"><h2>Separate current proposal</h2><dl><dt>Observation</dt><dd>Each shift understood the other to own the final checklist check. This does not establish fault or a cause.</dd><dt>Authored opening</dt><dd>${esc(opens[s.opening])}</dd><dt>Next move</dt><dd>${esc(nexts[s.next])}</dd><dt>Conditions, disagreement and unassigned work</dt><dd>Relevant authority: unknown. Protected time: unknown. Coverage: unknown. Protected capacity: unknown. Agreement: unresolved. Additional work: unassigned. Ownership needs clarification. No access condition is supplied.</dd><dt>Descriptive feedback</dt><dd>The proposal requests an account or clarification, or pauses. It does not settle responsibility, supply protected capacity or establish either shift’s agreement.</dd></dl><p class="notice">Fictional supported practice proposal; no workplace agreement, capability judgment or evidence of transfer.</p></section>`:''}`;}
function helpPage(){return `<article class="help"><p class="eyebrow">Help / teacher & reviewer area</p><h1 style="font-size:2.5rem">Inspect the rehearsal</h1><p>Implementation specialist simulation. No practitioner advice, human approval or evidence of learning is supplied.</p><div class="actions">${button('back','Return to the previous view','primary')}${button('paper','Complete paper alternative')}</div><details open><summary>What the tool does and leaves to humans</summary><p>Invented dialogue is authored possibility, never prediction. Optional text stays verbatim and unevaluated. No scores, rankings, profiling, certificates, recordings, attendance, export or sharing controls.</p><p>Humans retain workplace and disclosure decisions. Authority over access does not confer authority over every support. Participation protections, dignity, time, coverage, accessible materials and space are unsecured. Informal observation and employment pressure remain outside this tool’s control.</p><p>Volatile memory only; no storage, telemetry or requests. Cover removes rendered session content, retaining it for explicit Resume. Confirmed clearing resets both situations, plans, conditions, drafts, reviews and views. Neither prevents prior viewing or capture.</p></details><details><summary>Source, lineage and reconciliation</summary><p>The packet’s accepted Design revision 2 (sequence 20) integrates sequence 15 and sequence 18’s hypothetical withdrawal. No Map is supplied. The newer Design governs this build; a missing Map is not reconstructed.</p><p>The parent journal stays immutable, without baseline or approval status. Interruption and capacity-conflict events are hypothetical. Affected groups have not participated; human approval and field evidence are pending.</p></details><details><summary>R1 · Inquiry and reciprocal agency</summary><p>Origins: Workforce, Systems, Human-centered designer and Learning scientist. Requirement: distinguish facts, tentative explanations and missing accounts; preserve rejection, retention and revision without grading.</p><p>Interaction: labelled board, exact openings, authored responses, initial/current comparison and separate second situation. Purpose: inspect ambiguity, dissent and missing agreement.</p><p>Check: exercise every opening, reject feedback, retain tentative carelessness, postpone, finish without typing and inspect second-situation independence. Browser and human review pending.</p></details><details><summary>R2 · Feasibility is more than access</summary><p>Origins: Workforce, Systems, Human-centered designer, Responsible AI; revised by Scenario. Separate access, authority, time, coverage and agreement. Capacity is unavailable if either component is unavailable; otherwise unknown unless both are available.</p><p>Interaction: a template initial plan unlocks the changed condition: access offer, withdrawn capacity, withheld agreement, unresolved ownership. Clarification, reconsideration or pause leaves work unassigned; prospective selections preserve refusal.</p><p>Check: combine access with unavailable capacity; inspect conditional wording, refusal and ownership. Set future support Available; Monday’s history and refusal must remain, without invented agreement.</p></details><details><summary>R3 · Correction, recovery and alternatives</summary><p>Origins: hypothetical interruption, specialist agency/privacy/recovery and Scenario. Exact review precedes Apply/Cancel. Context, plan or support changes make it stale; renewed inspection requires separate Apply.</p><p>Check: open review, activate withdrawal, inspect stale review and retained draft. Renew, cancel, cover/resume; cancel clearing, then confirm from Cover. Inspect both situations reset. Keyboard, focus, narrow layout and accessibility concealment await browser inspection.</p><p>Paper materials below include all cards, support statuses, both sheets, correction/cancellation, second situation and cover/disposal. Speech and role-play are optional.</p></details><details><summary>Tradeoffs, evidence boundaries and pending review</summary><p>Choices reduce typing but constrain expression; two optional fields allow correction and a question. Dependencies add reading burden. Before/after exposes retention and revision without rewarding change.</p><p>Organizational repair, paper, writing, dissent, passing and no practice remain alternatives. Rota, ownership, staffing, access and time may matter more than training. This tool cannot authorize repairs.</p><p>Technical checks establish only inspected behavior, not comprehension, free participation, learning, retention, transfer or flourishing. Language, devices, authority, workload, privacy and credible refusal are unknown. Practitioner, affected-person, representative and field-use review are pending.</p></details></article>`;}
function paperSheet(label){return `<section class="card"><h3>${label} proposal sheet</h3><p class="small">Fictional practice only · no workplace agreement or capability judgment</p><dl>${['Observation','Invitation','Tentative interpretation','Next move','Access','Relevant authority and scope','Protected time','Shift coverage / combined capacity','Agreement: unresolved or withheld','Unassigned work','Unresolved questions / disagreement'].map(x=>`<dt>${x}</dt><dd></dd>`).join('')}</dl></section>`;}
function paperPage(){return `<article class="paper"><p class="eyebrow">Complete non-AI alternative / facilitator materials</p><h1 style="font-size:2.5rem">Conversation Lab, on paper</h1><p>Copy these complete materials onto paper. Fictional content only. Written selection is sufficient; speech and role-play are optional. Participation, sharing and the second situation are voluntary.</p><div class="actions">${button('back','Return to the previous view','primary')}</div><section class="card"><h2>Before offering the activity</h2><p>Arrange protected time, coverage, access, suitable space and participant-controlled disposal; none are secured here. Offer Pass, Stop or workflow review. Do not grade speech, speed, confidence, eye contact, script fidelity or help use.</p><p>No personal stories, collection, photographs, attendance assessment, required sharing or workplace/HR decisions. Inspect informal observation and pressure with affected people; no recording does not prevent them.</p><p><b>Materials:</b> the cards below; two proposal sheets; Available, Unavailable and Unknown status cards for each support; a blank replacement card and a blank question card; Pass and Stop cards; a plain opaque cover sheet. Participants control retained paper and disposal.</p></section><section class="card"><h2>Situation card</h2><p><b>Observed fictional facts:</b> Monday’s handoff note was absent. The next shift repeated a check.</p><p><b>Third story statement:</b> the new lead has not heard the colleague’s account.</p><p>Cause, responsibility and the relation between the absent note and repeated check remain unknown.</p></section><section class="card"><h2>Situation board</h2><div class="grid"><div><h3>Observed facts</h3><p>Absent Monday note.<br>Next shift repeated a check.</p></div><div><h3>Possible explanations</h3><p>Changed schedule; unavailable materials; unclear ownership; missed note; carelessness or other context. All tentative.</p></div><div><h3>Missing context</h3><p>Colleague’s full account; expected owner; support; cause of the repeated check.</p></div></div><p class="small">Use text labels, never color or position alone. Participants may retain “No explanation yet” or contest an interpretation.</p></section><section class="card"><h2>Exact opening cards</h2><ol>${Object.values(openingTexts).map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p><b>Next-move cards:</b> explore a shared template step, conditional on support and agreement; check expectations and ownership before assigning work; or pause until a suitable opportunity. Leave work unassigned.</p><p><b>Pass card:</b> “I pass this practice without a reason.”<br><b>Stop card:</b> “I stop now without a reason.”<br><b>Replacement card:</b> one chosen component + exact fictional replacement. <b>Question card:</b> one optional fictional unresolved question.</p></section><section class="card"><h2>Possible response cards</h2><p>Label every card: <b>Authored fictional possibility, not a prediction or evidence about people.</b></p><p>“Here is additional context.”<br>“I question that interpretation.”<br>“I would prefer to discuss this later.”</p><p>Participants can reject a card, retain their proposal or retry with another card. No praise, blame or score follows.</p></section><section class="card"><h2>Reveal card · invented context, not a complete cause</h2><p>The rota changed. The template was inaccessible to the colleague. The expected owner was unclear.</p><p>Keep the initial sheet intact. This information does not prove the cause of the repeated check or imply agreement.</p></section><section class="card"><h2>Support cards</h2><p>Prepare separate <b>Available / Unavailable / Unknown</b> cards for template access, relevant authority, protected time and coverage. Record the authority needed and its scope. An access offer is not confirmation.</p><p>Combined protected capacity: unavailable if time or coverage is unavailable; unknown if neither is unavailable and either is unknown; available only if both are available. Agreement stays independently unresolved or withheld. Available supports do not supply another person’s agreement.</p><p>Unknown or unavailable conditions produce a conditional proposal, inquiry or pause. Additional work remains unassigned.</p></section><section class="card"><h2>Changed-condition card · hypothetical</h2><p>Release only after a template-dependent initial proposal exists. An authorized fictional manager offers restored access if the colleague completes the note after their shift. Protected time and coverage have been withdrawn. Ownership remains unresolved.</p><p><b>Access offered; protected capacity unavailable; colleague agreement withheld; ownership unresolved.</b></p><p><b>Exact authored refusal:</b> “Making the template accessible does not give me time to complete it after my shift. I cannot agree to that extra work.”</p><p>Offer: request clarification of protected capacity and ownership; reconsider the next move; or pause. Retaining wording or rejecting feedback is allowed. Preserve the recorded refusal even if prospective supports change. Do not promise after-shift completion; leave work unassigned.</p></section><div class="paper-sheet">${paperSheet('Initial · before reveal')}${paperSheet('Current · conditions visible')}</div><section class="card"><h2>Feedback and correction card</h2><p>Ask neutrally: “Which wording is observation or explanation?” “Whose account or agreement is missing?” “What support makes the move feasible?”</p><p>Carelessness remains an explanation, not an observed cause. Process inquiry identifies an expectation to check. Template use depends on access, ownership, authority, capacity and agreement. Pausing leaves a suitable opportunity unarranged. Feedback can be rejected; revision is not itself success.</p><p>For a correction, write the exact replacement and affected component on the replacement card; add an optional unresolved question. Show exact wording and the independent conditions before a separate acceptance decision. Cancel keeps the current sheet and revealed conditions. If context or supports change during review, mark it stale; show the same draft with updated conditions, then ask for a new separate acceptance decision. Do not certify participant wording.</p></section><section class="card"><h2>Second situation · separate supported practice</h2><p><b>Exact card:</b> “Two shifts each understood the other to own the final checklist check.”</p><p>Use a fresh sheet. Do not carry over Monday’s inaccessible template, the refusal or capacity withdrawal. Both accounts, relevant authority, time, coverage and agreement are unknown; no access barrier is supplied.</p><p>Begin with fewer suggestions: choose hearing both accounts, clarifying expectations or pausing; then map roles, request clarification or pause. Opening help on request: “What did each shift understand about ownership of the final checklist check?” or “Can we clarify who was expected to own the final checklist check?” or “Let’s leave a decision open until both shifts can add their accounts.”</p><p>Leave work unassigned until ownership, authority, protected capacity and reciprocal agreement are arranged. Help use is ungraded. This is supported practice, not evidence of transfer.</p></section><section class="card"><h2>Facilitation sequence</h2><ol><li>Explain voluntary participation and paper handling. Offer written selection, Pass, Stop or no practice. Secure time, access, space and coverage first.</li><li>Present situation and labelled board. Invite an opening, tentative interpretation and provisional next move. Show a response card only as an invented possibility. Record the Initial proposal before revealing context.</li><li>Release the context reveal. If the initial plan depends on template work, release the complete changed-condition card. You may release it during a pending correction to inspect stale-review handling.</li><li>Keep each condition independent. Preserve Monday’s facts and the refusal. Offer clarification, reconsideration or pause. Leave extra work unassigned. Retention and dissent are credible options.</li><li>Invite one-component correction or retention. Review exact text and current conditions. A later condition change requires another review; cancellation does not reverse the event. Show Initial and Current sheets together and describe changes neutrally.</li><li>Optionally retry a response card or use the separate second situation. Supply immediate help on request. Do not grade speech, role-play, speed or help.</li><li>At an interruption, cover every card, sheet, draft and second-situation sheet with the opaque cover; resume only by the participant’s choice. Offer orientation without a recall task.</li><li>For complete handoff clearing, explain that both situations, cards bearing choices, drafts, reviews and proposals will be removed. Confirm separately; cancellation retains them. Dispose or erase all participant-marked materials under the participant-controlled arrangement, including anything under the cover. Do not collect or photograph them. Cover is retention, not clearing.</li></ol><p>Inspect participation and handling with affected people. No approval, practitioner judgment or learning evidence is supplied.</p></section></article>`;}
function neutralPage(){if(ui.view==='cover')return `<section class="neutral"><div class="icon" aria-hidden="true">▧</div><h1>Page covered</h1><p>Work stays in this open page. Resume by choice; refresh or closure loses it.</p><div class="actions">${button('resume','Resume','primary')}${button('resume-orient','Resume with orientation')}${button('clear','Finish & clear')}</div></section>`;if(ui.view==='clear')return `<section class="neutral" role="region" aria-label="Confirm complete clearing"><div class="icon" aria-hidden="true">↺</div><h1>Clear this session?</h1><p>Confirmation removes both situations, initial and current proposals, support and capacity choices, refusal state, all text, drafts, reviews, examples and open views from this candidate. You will return to the neutral start screen.</p><p>Cover keeps work; clearing removes it. This cannot remove prior viewing or external captures.</p><div class="actions">${button('confirm-clear','Confirm complete clearing','danger')}${button('cancel-clear','Cancel — retain work','primary')}</div></section>`;return `<section class="neutral"><div class="icon" aria-hidden="true">Ⅱ</div><h1>${ui.stopKind==='pass'?'Practice passed':'Practice stopped'}</h1><p>No explanation is required. Your fictional work remains in this open page until you clear it, refresh or close.</p><div class="actions">${button('return-session','Return when you choose','primary')}${button('paper','Paper alternative')}${button('cover','Cover')}${button('clear','Finish & clear')}</div></section>`;}
function render(focusKey){const neutral=['cover','clear','stopped'].includes(ui.view);let body=neutral?neutralPage():ui.view==='start'?startPage():ui.view==='help'?helpPage():ui.view==='paper'?paperPage():ui.view==='second'?secondPage():mainPage();app.innerHTML=shell(body,!neutral);if(focusKey){const target=app.querySelector(`[data-focus="${focusKey}"]`);if(target)target.focus();else app.querySelector('#content')?.focus();}else app.querySelector('#content')?.focus();}
function invalidate(message){session.conditionVersion++;if(session.review)session.review.stale=true;if(message)ui.status=message;}
function captureInitial(){if(session.initial)return;session.initial=snapshot();invalidate('Initial proposal recorded before new context.');render();}
function revealContext(){if(!session.initial||session.revealed)return;session.revealed=true;invalidate('Fictional context added. Existing correction reviews need renewed inspection.');render();}
function triggerWithdrawal(){if(!session.revealed||session.withdrawn||session.initial?.next!=='template')return;session.withdrawn=true;session.accessOffered=true;session.support.access='unknown';session.support.time='unavailable';session.support.coverage='unavailable';invalidate('Capacity withdrawal and refusal recorded. Any pending correction review is stale.');render();}
function setSupport(key,value){if(!Object.prototype.hasOwnProperty.call(session.support,key)||!['available','unavailable','unknown'].includes(value))return;session.support[key]=value;invalidate('Prospective support changed. Recorded history and any refusal remain.');render('support-'+key);}
function prepareReview(kind='edit'){if(!session.initial)return;if(kind==='edit'&&!session.draft.replacement.trim()&&!session.draft.question.trim()){ui.status='No new wording or question to review. The current proposal is retained.';render();return;}session.review={kind,component:session.draft.component,replacement:session.draft.replacement,question:session.draft.question,version:session.conditionVersion,conditions:snapshot(),stale:false};ui.status='Exact correction prepared for inspection; it has not been applied.';render();}
function applyReview(){const r=session.review;if(!r||r.stale||r.version!==session.conditionVersion)return;if(r.kind==='restore')session.overrides={};else if(r.kind==='remove-question')session.question='';else {if(r.replacement.trim())session.overrides[r.component]=r.replacement;if(r.question.trim())session.question=r.question;}session.review=null;session.draft={component:session.draft.component,replacement:'',question:''};invalidate('Reviewed correction applied. Independent conditions still apply.');render();}
function cancelReview(){session.review=null;ui.status='Review cancelled. Current wording and all revealed conditions are retained.';render();}
function cover(){ui.coverReturn=ui.view;ui.view='cover';ui.orientation=false;render();}
function resume(orient=false){ui.view=ui.coverReturn;ui.orientation=orient;ui.status='Resumed by your choice. Drafts and recorded conditions are retained.';render();}
function clearAll(){session=freshSession();ui=freshUI();render();}
function openDetail(view){if(ui.view!=='help'&&ui.view!=='paper')ui.returnTo=ui.view;ui.view=view;render();}
function draftChanged(){if(session.review){session.review.stale=true;const region=app.querySelector('#review-area');if(region)region.innerHTML=reviewHTML(session.review);}}
app.addEventListener('input',event=>{const t=event.target;if(t.name==='replacement'||t.name==='question'){session.draft[t.name]=t.value;draftChanged();}});
app.addEventListener('change',event=>{const t=event.target;const name=t.name;const value=t.value;if(['opening','interpretation','next'].includes(name)){session[name]=value;if(name==='opening')session.rejected=false;invalidate('Selection changed; any pending correction must be reviewed again.');render(name+'-'+value);}else if(name==='response'){session.response=value;session.rejected=false;render('response');}else if(name?.startsWith('support-'))setSupport(name.slice(8),value);else if(name==='component'){session.draft.component=value;draftChanged();}else if(name==='second-opening'){session.second.opening=value;session.second.applied=false;render(name+'-'+value);}else if(name==='second-next'){session.second.next=value;session.second.applied=false;render(name+'-'+value);}});
app.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='skip'){app.querySelector('#content')?.focus();}else if(a==='begin'){ui.view='main';render();}else if(a==='capture')captureInitial();else if(a==='reveal')revealContext();else if(a==='withdraw')triggerWithdrawal();else if(a==='reject'){session.rejected=!session.rejected;render();}else if(a==='review')prepareReview();else if(a==='renew')prepareReview(session.review?.kind||'edit');else if(a==='apply')applyReview();else if(a==='cancel-review')cancelReview();else if(a==='restore')prepareReview('restore');else if(a==='remove-question')prepareReview('remove-question');else if(a==='discard'){session.draft={component:'invitation',replacement:'',question:''};session.review=null;ui.status='Draft discarded. The current proposal and conditions are retained.';render();}else if(a==='cover')cover();else if(a==='resume')resume();else if(a==='resume-orient')resume(true);else if(a==='clear'){ui.clearReturn=ui.view;ui.view='clear';render();}else if(a==='cancel-clear'){ui.view=ui.clearReturn;render();}else if(a==='confirm-clear')clearAll();else if(a==='pass'||a==='stop'){ui.stopReturn=ui.view;ui.stopKind=a;ui.view='stopped';render();}else if(a==='return-session'){ui.view=ui.stopReturn;render();}else if(a==='paper'||a==='help')openDetail(a);else if(a==='back'){ui.view=ui.returnTo;render();}else if(a==='second'){session.second.started=true;ui.view='second';render();}else if(a==='return-main'){ui.view='main';render();}else if(a==='second-help'){session.second.help=!session.second.help;render();}else if(a==='second-plan'){session.second.applied=true;render();}else if(a==='route-clarify'){session.routeChoice='clarify';session.next='clarify';invalidate('Clarification selected. Independent refusal and withdrawal remain.');render();}else if(a==='route-reconsider'){session.routeChoice='reconsider';invalidate('Reconsideration selected; wording retained for inspection.');render();}else if(a==='route-pause'){session.routeChoice='pause';session.next='pause';invalidate('Pause selected. Additional work remains unassigned.');render();}});
render();
</script>
</body>
</html>
