<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
<title id="title">Coordination in the Agentic LE rehearsal</title><desc id="desc">A fictional seed is considered by bounded specialist roles, integrated by a simulated learning engineer, and made into a versioned artifact. Hypothetical scenarios can reopen a requirement. Observed implementation findings can reopen Build. A real human pilot gate remains pending.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#285c69"/></marker></defs>
<rect width="980" height="470" rx="12" fill="#f7f4ec"/>
<g font-family="system-ui,sans-serif" fill="#182031"><text x="28" y="36" font-size="21" font-weight="700">A product and the decisions that shape it</text><text x="28" y="62" font-size="15">Implemented rehearsal mechanisms; human teamwork and field benefit remain unevaluated.</text></g>
<g fill="#fff" stroke="#b7c5c8" stroke-width="1.5"><rect x="28" y="106" width="196" height="112" rx="8"/><rect x="272" y="106" width="196" height="112" rx="8"/><rect x="516" y="106" width="196" height="112" rx="8"/><rect x="760" y="106" width="192" height="112" rx="8"/></g>
<g font-family="system-ui,sans-serif" font-size="17" fill="#182031"><text x="44" y="136" font-weight="700">Fictional seed</text><text x="44" y="164" font-size="15">Problem, people, context</text><text x="44" y="187" font-size="15">and declared constraints</text><text x="288" y="136" font-weight="700">Specialist roles</text><text x="288" y="164" font-size="15">Bounded contributions</text><text x="288" y="187" font-size="15">and unresolved concerns</text><text x="532" y="136" font-weight="700">Integration</text><text x="532" y="164" font-size="15">Learning-engineer role</text><text x="532" y="187" font-size="15">records a decision</text><text x="776" y="136" font-weight="700">Versioned artifact</text><text x="776" y="164" font-size="15">Requirements and code</text><text x="776" y="187" font-size="15">linked to their source</text></g>
<g fill="none" stroke="#285c69" stroke-width="2.5" marker-end="url(#arrow)"><path d="M224 162H270"/><path d="M468 162H514"/><path d="M712 162H758"/><path d="M374 306V244H606V220"/><path d="M851 218V303"/><path d="M696 357H610V220"/></g>
<g fill="#eef3f2" stroke="#b7c5c8" stroke-width="1.5"><rect x="28" y="306" width="447" height="95" rx="8"/><rect x="696" y="306" width="256" height="95" rx="8"/></g>
<g font-family="system-ui,sans-serif" fill="#182031"><text x="44" y="335" font-size="17" font-weight="700">Hypothetical challenge</text><text x="44" y="360" font-size="15">Scenario → named assumption → requirement revision</text><text x="44" y="384" font-size="14">A scenario is not an observed incident.</text><text x="712" y="335" font-size="17" font-weight="700">Implementation inspection</text><text x="712" y="360" font-size="15">Finding → correction → new check</text><text x="712" y="384" font-size="14">Tested behavior is not learning.</text></g>
<text x="28" y="442" font-family="system-ui,sans-serif" font-size="16" fill="#285c69">The journal preserves the work. Human pilot approval, affected-person review and field evidence are pending.</text>
</svg>