<!-- Show the capability cycle, continuous refinement and deployment back to the challenge. -->
<svg class="diagram-svg" viewBox="0 0 800 720" role="group" aria-labelledby="cycle-title cycle-description">
          <title id="cycle-title">The Capability Pipeline: seven steps, continuous refinement</title>
          <desc id="cycle-description">A challenge enters Step 1, Understand, through a dotted arrow. The numbered cycle continues through 2 Map, 3 Design, 4 Build, 5 Instrument, 6 Experiment and 7 Evaluate, then returns directly to Understand. 8 Refine is at the center and informs every step. The cycle produces a capability. A return arrow labeled Deployment connects Capability back to Challenge.</desc>
          <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-muted)"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>
          <circle class="cycle-backdrop" cx="400" cy="350" r="165"/>
          <circle class="cycle-guide" cx="400" cy="350" r="205"/>
          <g class="context-node" id="challenge"><rect x="310" y="12" width="180" height="46" rx="23"/><text x="400" y="41" text-anchor="middle">Challenge</text></g>
          <path class="challenge-arrow" data-from="challenge" data-to="understand" d="M400 58 V109" marker-end="url(#arrow-accent)"/>
<line class="flow-arrow" data-from="understand" data-to="map" x1="431.5" y1="160.2" x2="526.9" y2="206.1" marker-end="url(#arrow)"/>
<line class="refinement-link" x1="400.0" y1="275.0" x2="400.0" y2="183.0"/>
<line class="flow-arrow" data-from="map" data-to="design" x1="568.1" y1="256.3" x2="591.6" y2="359.5" marker-end="url(#arrow)"/>
<line class="refinement-link" x1="458.6" y1="303.2" x2="530.6" y2="245.9"/>
<line class="flow-arrow" data-from="design" data-to="build" x1="578.0" y1="423.0" x2="512.0" y2="505.8" marker-end="url(#arrow)"/>
<line class="refinement-link" x1="473.1" y1="366.7" x2="562.8" y2="387.2"/>
<line class="flow-arrow" data-from="build" data-to="instrument" x1="453.9" y1="534.7" x2="348.1" y2="534.7" marker-end="url(#arrow)"/>
<line class="refinement-link" x1="432.5" y1="417.6" x2="472.5" y2="500.5"/>
<line class="flow-arrow" data-from="instrument" data-to="deploy" x1="289.2" y1="507.3" x2="223.2" y2="424.5" marker-end="url(#arrow)"/>
<line class="refinement-link" x1="367.5" y1="417.6" x2="327.5" y2="500.5"/>
<line class="flow-arrow" data-from="deploy" data-to="evaluate" x1="207.9" y1="361.5" x2="231.5" y2="258.3" marker-end="url(#arrow)"/>
<line class="refinement-link" x1="326.9" y1="366.7" x2="237.2" y2="387.2"/>
<line class="flow-arrow" data-from="evaluate" data-to="understand" x1="271.3" y1="207.0" x2="366.7" y2="161.1" marker-end="url(#arrow)"/>
<line class="refinement-link" x1="341.4" y1="303.2" x2="269.4" y2="245.9"/>
<g class="refine-node" id="refine"><circle cx="400" cy="350" r="74"/><text class="refine-label" x="400" y="344" text-anchor="middle">8. Refine</text><text class="center-label" x="400" y="369" text-anchor="middle">throughout</text></g>
<g class="step-node" data-pair="frame"><circle cx="400.0" cy="145.0" r="32"/><text class="num" x="400.0" y="151.0" text-anchor="middle">1</text><text class="lbl" x="449.0" y="156.0" text-anchor="start">Understand</text></g>
<g class="step-node" data-pair="frame"><circle cx="560.3" cy="222.2" r="32"/><text class="num" x="560.3" y="228.2" text-anchor="middle">2</text><text class="lbl" x="603.3" y="192.9" text-anchor="start">Map</text></g>
<g class="step-node" data-pair="create"><circle cx="599.9" cy="395.6" r="32"/><text class="num" x="599.9" y="401.6" text-anchor="middle">3</text><text class="lbl" x="653.5" y="412.9" text-anchor="start">Design</text></g>
<g class="step-node" data-pair="create"><circle cx="488.9" cy="534.7" r="32"/><text class="num" x="488.9" y="540.7" text-anchor="middle">4</text><text class="lbl" x="512.8" y="589.3" text-anchor="start">Build</text></g>
<g class="step-node" data-pair="operate"><circle cx="311.1" cy="534.7" r="32"/><text class="num" x="311.1" y="540.7" text-anchor="middle">5</text><text class="lbl" x="287.2" y="589.3" text-anchor="end">Instrument</text></g>
<g class="step-node" data-pair="operate"><circle cx="200.1" cy="395.6" r="32"/><text class="num" x="200.1" y="401.6" text-anchor="middle">6</text><text class="lbl" x="146.5" y="412.9" text-anchor="end">Experiment</text></g>
<g class="step-node" data-pair="learn"><circle cx="239.7" cy="222.2" r="32"/><text class="num" x="239.7" y="228.2" text-anchor="middle">7</text><text class="lbl" x="196.7" y="192.9" text-anchor="end">Evaluate</text></g>
<path class="output-arrow" data-from="cycle" data-to="capability" d="M400 560 V625" marker-end="url(#arrow-accent)"/>
          <text class="center-label" x="415" y="600">produces</text>
          <g class="context-node" id="capability"><rect x="290" y="635" width="220" height="48" rx="24"/><text x="400" y="665" text-anchor="middle">Capability</text></g>
          <path class="output-arrow deployment-return" data-from="capability" data-to="challenge" d="M510 659 H765 V35 H500" marker-end="url(#arrow-accent)"/>
          <text class="deployment-label" x="745" y="350" text-anchor="middle" transform="rotate(-90 745 350)">Deployment</text>
        </svg>
